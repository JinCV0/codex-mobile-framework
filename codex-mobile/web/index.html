/* ---------- 对话详情 ---------- */
const logEl = $('log');
// 本来就在底部才跟着滚：用户往上翻看历史时，别把他拽回去
const nearBottom = () => logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 140;
const scrollDown = (force) => { if (force || nearBottom()) logEl.scrollTop = logEl.scrollHeight; };
// 同一份内容不重复重画（长对话里，刷新时全量重画最费）
let lastHistorySig = '';
function historySig(messages) {
  if (!messages || !messages.length) return '0';
  const m = messages[messages.length - 1] || {};
  return messages.length + '|' + (m.role || '') + '|' + String(m.text || '').length + '|' +
    ((m.activities || []).length);
}

// 电脑上那条对话的真实标题 / 目录优先，本地会话可能还留着接管的占位名
function chatThread(s) {
  return (s && s.threadId) ? ((threads || []).find((x) => x.id === s.threadId) || {}) : {};
}
// 一条对话显示在哪个项目下。手机这边自己建的以它自己的目录为准：选了
// 「不指定项目」的（目录为空）就一直显示"未指定项目"，不能因为在默认目录里
// 跑过一轮，就把默认目录显示成它的项目。
function dirLabel(s, t) {
  return (s && s.cwd) || (t && t.cwd) || '未指定项目';
}
function chatTitle(s) {
  const t = chatThread(s);
  return t.name || t.preview || (s && s.title) || '对话';
}

async function openChat(id) {
  // 打开一条对话原本要串行等三趟：select → state → 历史，走公网实测 1.7 秒
  //（单趟地板 363ms）。这里把历史那趟先发出去（threadId 手上的列表里就有），
  // 而 select 会把新的 state 一起带回来 —— 三趟并成一趟。
  const known = (state.sessions || []).find((x) => x.id === id) || {};
  const histP = known.threadId ? readThread(known.threadId) : null;
  if (id !== state.activeId) {
    const r = await apiPost('session/select', { id });
    if (r.ok) applyState(await r.json());
    else await refresh();
  }
  openId = id;
  loadDraft();              // 这条对话上次没发出去的字，原样放回输入框
  if (outbox.length) flushOutbox(id);   // 切进来就试着把没发出去的补发掉
  refreshRunning();       // 换了对话：发送按钮按这条对话自己的状态来
  seenThreadGen = 0;      // 换了一条对话，校准号重新记
  remoteRunning = false;
  lastHistorySig = '';   // 换了一条对话，历史必须重画
  const s = state.active || {};
  const t = chatThread(s);
  const titleNow = chatTitle(s), pathNow = dirLabel(s, t);
  $('chat-title').textContent = titleNow;
  $('chat-path').textContent = pathNow;
  // 连标题一起记下来：下次启动可以不等网络就把这条对话画出来
  writeLast({ chat: id, chatTitle: titleNow, chatPath: pathNow });
  closeDrawer();
  setChatVisible(true);
  if (window.scrollY) window.scrollTo(0, 0);

  // 先把手上的内容画出来：本轮的本地消息，或者上一次缓存的记录
  const mine = s.messages || [];
  const cached = s.threadId ? readMsgs('t-' + s.threadId) : readMsgs('s-' + id);
  const first = mine.length ? mine : (cached || []);
  if (first.length) renderHistory(first);
  else if (s.threadId) logEl.innerHTML = '<div class="act" style="padding:10px 2px">正在读取对话</div>';
  // 新开的对话本来就没有历史，直接给"打字就能发"的空状态，
  // 否则会一直挂着"正在读取对话"，看着像卡住了
  else renderHistory([]);

  // 这一条还在电脑上生成：先挂个"正在生成回答"，别让人以为没反应
  if (runMatches(runState, s)) showGenerating();

  // 再去电脑上要最新的（这一趟其实早就发出去了，这里只是等结果）
  if (s.threadId) {
    try {
      const d = await (histP || readThread(s.threadId));
      if (openId !== id) return;   // 用户又切到别的对话了，别把这条的历史画上去
      if (d) {
        const remote = d.messages || [];
        paintContinue(d.lastStatus);
        applyThreadRun(d.lastStatus);
        writeThreadStatus(s.threadId, d.lastStatus);
        if (remote.length) {
          writeMsgs('t-' + s.threadId, remote);
          renderHistory(remote);
          if (runMatches(runState, s)) showGenerating();
        } else if (!first.length) renderHistory([]);
      } else if (!first.length) {
        logEl.innerHTML = '<div class="empty">' + ico('warning-circle') +
          '<div class="e1">读不到这条对话</div><div class="e2">检查一下手机和电脑的网络</div></div>';
      }
    } catch (_) {
      if (!first.length) {
        logEl.innerHTML = '<div class="empty">' + ico('warning-circle') +
          '<div class="e1">读不到这条对话</div><div class="e2">检查一下手机和电脑的网络</div></div>';
      }
    }
  }
}

function closeChat() {
  setChatVisible(false);
  hideGenerating();
  openId = null;
  writeLast({ chat: null });
  renderChats();
  loadThreads(false);   // 回列表顺手对一遍电脑上的最新状态
}

// 服务端历史里已经有这条消息了，就别再把它挂成"没发出去"。
//
// 不这么做的话：历史画一条真消息，paintQueued 又画一条待发气泡 ——
// 同一条在界面上出现两遍，而且会一直转着重发（用户看到的就是这个）。
// 用时间窗比一下，避免把"用户故意连发两句一模一样的话"误删。
function dropDeliveredQueued(messages) {
  if (!openId || !outbox.length || !messages || !messages.length) return;
  let last = null;
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i] && messages[i].role === 'user' && messages[i].text) { last = messages[i]; break; }
  }
  if (!last) return;
  const text = String(last.text).trim();
  const ts = Number(last.ts) || 0;
  const keep = outbox.filter((q) => {
    if (q.sessionId !== openId) return true;          // 别的对话的不动
    if ((q.text || '').trim() !== text) return true;   // 不是同一条
    if (!ts || !q.at) return true;
    return !(ts >= q.at - 120000);                     // 收到的这条就是我发的
  });
  if (keep.length !== outbox.length) { outbox = keep; saveOutbox(); }
}

function renderHistory(messages) {
  dropDeliveredQueued(messages);
  const sig = historySig(messages);
  if (sig === lastHistorySig && logEl.childElementCount) return;
  lastHistorySig = sig;
  const s = state.active || {};
  if (s.threadId) writeMsgs('t-' + s.threadId, messages);
  else if (s.id) writeMsgs('s-' + s.id, messages);
  logEl.innerHTML = '';
  const queuedHere = openId ? queuedFor(openId) : [];
  if (!messages || !messages.length) {
    if (!queuedHere.length) {
      logEl.innerHTML = '<div class="empty">' + ico('chat-circle-dots') +
        '<div class="e1">直接打字发消息</div><div class="e2">它跑在你自己电脑上，用的就是你本机的 Codex</div></div>';
      return;
    }
  } else {
	messages.forEach((m) => {
    if (m.role === 'user') { addUser(m.text); return; }
    const html = renderMarkdown(m.text || '');
    addAssistant(html, m.activities);
    // 桌面端每条回复下面都写着"用时"，这里照抄
    if (m.durationMs) addElapsedNote(m.durationMs);
    // 这一轮改了哪些文件：一张汇总卡
    if (m.files || m.added || m.removed) {
      renderFileChange({ files: m.files, added: m.added, removed: m.removed });
    }
  });
  // 最后一条助手回复下面挂操作行（复制 / 重试）+ "内容由 AI 生成"
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i].role !== 'assistant') continue;
    let prevUser = '';
    for (let j = i - 1; j >= 0; j--) {
      if (messages[j].role === 'user') { prevUser = messages[j].text || ''; break; }
    }
    appendActions(renderMarkdown(messages[i].text || ''), prevUser);
    break;
  }
  }
  paintQueued();   // 没发出去的几条永远钉在最下面
  scrollDown();
}
function addUser(text) {
  const row = document.createElement('div');
  row.className = 'mrow me';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  logEl.appendChild(row);
  scrollDown(true);   // 自己刚发的，一定要跟到底
}
function addAssistant(html, activities) {
  if (activities && activities.length) {
    const wrap = document.createElement('div');
    wrap.className = 'acts';
    // 工具调用多了会刷屏，只留最后几条，其余折成一行
    const shown = activities.slice(-4);
    if (activities.length > shown.length) {
      const d = document.createElement('div');
      d.className = 'act';
      d.textContent = '> 前面还有 ' + (activities.length - shown.length) + ' 步';
      wrap.appendChild(d);
    }
    shown.forEach((a) => {
      const d = document.createElement('div');
      d.className = 'act';
      d.textContent = '> ' + a;
      wrap.appendChild(d);
    });
    logEl.appendChild(wrap);
  }
  const row = document.createElement('div');
  row.className = 'mrow ai';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = html;
  row.appendChild(b);
  logEl.appendChild(row);
  attachCopy(b);
  scrollDown();
  return b;
}
// 文件改动卡片（"4 个文件已更改 +128 -0"）：形态照着桌面端来。
// 只给汇总，不给每个文件的路径和 diff：手机上不看这些明细，
// 而走公网把它们传下来纯属白占链路（明细去电脑上看）。
function renderFileChange(evt) {
  const row = document.createElement('div');
  row.className = 'mrow ai';
  const card = document.createElement('div');
  card.className = 'fcbox';
  card.innerHTML =
    '<span class="lead">' + ico('folder-simple') + '</span>' +
    '<span class="bd"><div class="t1">' + (evt.files || 0) + ' 个文件已更改</div>' +
    '<div class="t2"><span class="plus">+' + (evt.added || 0) + '</span>' +
    '<span class="minus">-' + (evt.removed || 0) + '</span></div></span>';

function fmtSize(n) {
  n = Number(n || 0);
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}

function copyText(text) {
  const done = () => toast('已复制');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => toast('复制失败'));
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (_) { toast('复制失败'); }
  ta.remove();
}

// 助手消息下面的操作行：复制 / 重试 + "内容由AI生成"（桌面端也有这一排）
function appendActions(html, retryText) {
  const row = document.createElement('div');
  row.className = 'actrow';
  const copy = document.createElement('button');
  copy.innerHTML = ico('copy');
  copy.title = '复制';
  copy.addEventListener('click', () => {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    copyText(tmp.textContent || '');
  });
  row.appendChild(copy);
  if (retryText) {
    const retry = document.createElement('button');
    retry.innerHTML = ico('arrow-clockwise');
    retry.title = '重试这一轮';
    retry.addEventListener('click', () => {
      if (running || remoteRunning) { toast('这一轮还在跑'); return; }
      inputEl.value = retryText;
      inputEl.style.height = 'auto';
      send();
    });
    row.appendChild(retry);
  }
  logEl.appendChild(row);
  const ai = document.createElement('div');
  ai.className = 'ailabel';
  ai.textContent = '内容由 AI 生成';
  logEl.appendChild(ai);
}

// 不在那条对话上的审批 / 选择题：发一条本地通知，前台再补一条 toast。
//
// 以前这里只处理"当前正开着那条对话"的情况，别的场合什么都不做 ——
// 2026-10-11 那次就是这么漏的：审批在电脑那边等着人拍板，手机上一点动静
// 都没有，卡满 10 分钟直接按拒绝处理，那一轮就白跑了。
const seenPending = new Set();
function alertPending(title, body, sessionId) {
  const key = sessionId + '|' + title + '|' + body;
  if (seenPending.has(key)) return;
  if (seenPending.size > 50) seenPending.clear();   // 别让它无上限地长
  seenPending.add(key);
  const s = (state.sessions || []).find((x) => x.id === sessionId);
  const who = (s && s.title) ? ('「' + s.title + '」') : '另一条对话';
  notifyHidden(title + ' · ' + who, body);
  if (!document.hidden) toast(who + '：' + body);
}

// 选择题：Codex 让你在几个选项里挑一个。手机直接点，不用回电脑。
function renderQuestion(evt) {

  row.className = 'mrow ai';
  const card = document.createElement('div');

  submit.className = 'ap-btn ok';
  submit.textContent = '确定';
  submit.disabled = true;
  submit.style.marginTop = '8px';

    submit.disabled = qs.some((q) => !answers[q.id] || !answers[q.id].length);
    submit.textContent = submit.disabled ? '每个问题都选一个' : '确定';
  };

  qs.forEach((q) => {
    const box = document.createElement('div');
    box.className = 'qbox';
    const head = document.createElement('div');
    head.className = 'qhead';
    head.textContent = q.header || '请选择';

    if (q.text) {
      const t = document.createElement('div');
      t.className = 'qtext';
      t.textContent = q.text;
      box.appendChild(t);
    }

    opts.className = 'qopts';
    (q.options || []).forEach((o) => {

      b.className = 'ap-btn';
      b.textContent = o.label;

// 这一轮的文件改动先记账，跑完只出一张汇总卡（以前改一个文件弹一条，很吵）

function renderAtts() {
  const bar = $('attbar');
  if (!bar) return;
  bar.innerHTML = '';
  bar.classList.toggle('on', pendingAtts.length > 0);
  pendingAtts.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'att' + (a.path ? '' : ' up');
    if (a.image && a.thumb) {

      img.src = a.thumb;
      d.appendChild(img);

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',').pop() || '');
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

async function attachFiles(files) {
  for (const f of files) {
    const item = {
      name: f.name, image: (f.type || '').startsWith('image/'),
      thumb: '', path: '',
    };
    if (item.image) { try { item.thumb = URL.createObjectURL(f); } catch (_) {} }
    pendingAtts.push(item);
    renderAtts();
    try {
      const data = await fileToBase64(f);
      const r = await apiPost('upload', { name: f.name, data });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      item.path = d.path || '';
      item.image = !!d.image;
      if (d.name) item.name = d.name;
    } catch (e) {
      pendingAtts = pendingAtts.filter((x) => x !== item);
      toast('上传失败：' + e.message);
    }
    renderAtts();
  }
}

/* ---------- 消息里的图片：点开全屏看，可左右滑 / 双指缩放 / 看原图 / 下载 ---------- */
const imgview = $('imgview'), imgviewImg = $('imgview-img'), imgstage = $('imgstage');
const imgviewOrig = $('imgview-orig'), imgviewSave = $('imgview-save');
const imgviewCount = $('imgview-count');

let imgviewList = [];        // 当前对话里的图，按出现顺序
let imgviewIdx = -1;
let imgviewFullURL = '', imgviewIsFull = false;
// scale=1 时单指左右滑 = 切图；scale>1 时单指拖 = 平移
let ivScale = 1, ivTx = 0, ivTy = 0;
const ivPointers = new Map();
let ivPinch = null, ivDrag = null;
let ivMoved = false;   // 这一下是拖还是点：拖过就别当成"点空白关闭"

function collectChatImages() {
  return Array.from(document.querySelectorAll('#log img.mdimg')).map((el) => ({
    thumb: el.getAttribute('src') || '',
    full: el.dataset.full || el.getAttribute('src') || '',
  }));
}

function applyIvTransform() {
  imgviewImg.style.transform =
    'translate(' + ivTx + 'px,' + ivTy + 'px) scale(' + ivScale + ')';
}

function resetIvTransform() {
  ivScale = 1; ivTx = 0; ivTy = 0;
  imgviewImg.classList.remove('snap');
  applyIvTransform();
}

// 放大之后别让图被拖出屏幕
function clampPan() {
  const r = imgviewImg.getBoundingClientRect();
  const maxX = Math.max(0, (r.width - window.innerWidth) / 2 + 40);
  const maxY = Math.max(0, (r.height - window.innerHeight) / 2 + 40);
  ivTx = Math.max(-maxX, Math.min(maxX, ivTx));
  ivTy = Math.max(-maxY, Math.min(maxY, ivTy));
}

function showImgViewerAt(i) {
  const it = imgviewList[i];
  if (!it) return;
  imgviewIdx = i;
  resetIvTransform();
  imgviewFullURL = it.full || '';
  imgviewIsFull = false;
  imgviewImg.src = it.thumb || it.full || '';
  const hasFull = !!imgviewFullURL && imgviewFullURL !== imgviewImg.src;
  imgviewOrig.disabled = !hasFull;
  imgviewOrig.textContent = hasFull ? '查看原图' : '已是原图';
  imgviewCount.textContent = imgviewList.length > 1
    ? ((i + 1) + ' / ' + imgviewList.length) : '';
}

function openImgViewer(i, list) {
  imgviewList = list || collectChatImages();
  if (!imgviewList.length) return;
  showImgViewerAt(Math.max(0, Math.min(i, imgviewList.length - 1)));
  imgview.classList.add('on');
}

function closeImgViewer() {
  imgview.classList.remove('on');
  resetIvTransform();
  imgviewList = [];
  imgviewIdx = -1;
}

// 点背景关掉；点按钮和图片本身不关（图片要留着拖动）
imgview.addEventListener('click', (e) => {
  if (e.target.closest('.imgbar') || e.target.closest('.imgx')) return;
  if (e.target === imgviewImg) return;
  // 刚拖过的这一下不算"点空白"，否则滑完一张图就被顺手关掉了
  if (ivMoved) { ivMoved = false; return; }
  closeImgViewer();
});
$('imgview-close').addEventListener('click', closeImgViewer);

// 用事件委托：气泡是动态重画的，绑在 #log 上才绑得住
$('log').addEventListener('click', (e) => {
  const img = e.target.closest('img.mdimg');
  if (!img) return;
  // 列表里画的是缩略图（几十 KB），点开先给同一张，别让用户干等
  const list = collectChatImages();
  const src = img.getAttribute('src') || '';
  const i = list.findIndex((x) => x.thumb === src);
  openImgViewer(i >= 0 ? i : 0, list);
});

/* 手势：双指缩放、放大后单指拖动、缩小时单指左右滑切图。
   用 Pointer Events 而不是 touch 事件 —— 多指和指针捕获都是现成的。 */
imgstage.addEventListener('pointerdown', (e) => {
  ivPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { imgstage.setPointerCapture(e.pointerId); } catch (_) {}
  if (ivPointers.size === 2) {
    const [a, b] = [...ivPointers.values()];
    ivPinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, scale: ivScale };
    ivDrag = null;
  } else if (ivPointers.size === 1) {
    ivMoved = false;
    ivDrag = { x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, tx0: ivTx, ty0: ivTy };
    // 缩放到 1 倍时去掉过渡，跟手滑才不粘
    if (ivScale <= 1.001) imgviewImg.classList.add('snap');
  }
});

imgstage.addEventListener('pointermove', (e) => {
  if (!ivPointers.has(e.pointerId)) return;
  ivPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (ivPointers.size === 2 && ivPinch) {
    const [a, b] = [...ivPointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    ivScale = Math.max(1, Math.min(5, ivPinch.scale * d / ivPinch.dist));
    if (ivScale <= 1.001) { ivTx = 0; ivTy = 0; } else { clampPan(); }
    applyIvTransform();
    return;
  }
  if (ivPointers.size === 1 && ivDrag) {
    ivDrag.dx = e.clientX - ivDrag.x0;
    ivDrag.dy = e.clientY - ivDrag.y0;
    if (Math.abs(ivDrag.dx) > 6 || Math.abs(ivDrag.dy) > 6) ivMoved = true;
    if (ivScale <= 1.001) {
      imgviewImg.style.transform = 'translateX(' + ivDrag.dx + 'px)';
    } else {
      ivTx = ivDrag.tx0 + ivDrag.dx;
      ivTy = ivDrag.ty0 + ivDrag.dy;
      clampPan();
      applyIvTransform();
    }
  }
});

function endPointer(e) {
  ivPointers.delete(e.pointerId);
  if (ivPointers.size < 2) ivPinch = null;
  if (!ivDrag) {
    if (ivScale <= 1.001) resetIvTransform();
    return;
  }
  const d = ivDrag;
  ivDrag = null;
  imgviewImg.classList.remove('snap');
  if (ivPointers.size === 0 && ivScale <= 1.001) {
    // 滑过屏宽的两成就翻页，同时要求以横向为主，免得竖直滚动误触
    const th = Math.min(90, window.innerWidth * 0.2);
    if (Math.abs(d.dx) > th && Math.abs(d.dx) > Math.abs(d.dy) * 1.2) {
      const next = imgviewIdx + (d.dx < 0 ? 1 : -1);
      if (next >= 0 && next < imgviewList.length) { showImgViewerAt(next); return; }
    }
    resetIvTransform();   // 没过阈值就弹回去
  } else {
    clampPan();
    applyIvTransform();
  }
}
imgstage.addEventListener('pointerup', endPointer);
imgstage.addEventListener('pointercancel', endPointer);

imgviewOrig.addEventListener('click', () => {
  if (!imgviewFullURL || imgviewIsFull) return;
  imgviewIsFull = true;
  imgviewOrig.disabled = true;
  imgviewOrig.textContent = '原图加载中…';
  // 先悄悄预载，装好了再换上 —— 免得点下去白屏等半天

    imgviewOrig.disabled = false;
    imgviewOrig.textContent = '原图加载失败';
  };
  probe.src = imgviewFullURL;
});

imgviewSave.addEventListener('click', () => {

/* ---------- 发消息 ---------- */
const inputEl = $('input');
const sendBtn = $('send');
function setRunning(v) {
  running = v;
  paintSend();
}

// 发送键三种状态：空闲=发送；正在跑且输入框空=停止；正在跑且输入框有字=引导。
// 这也是 Codex 桌面版的习惯：正在跑的时候，打字再点就是"把这句话插进这一轮"。
function paintSend() {
  const hasText = !!inputEl.value.trim();
  // 电脑端发起的那一轮也算"正在进行"：手机上照样能停止或引导
  const busyNow = running || remoteRunning;
  if (busyNow && !hasText) {
    sendBtn.innerHTML = '<svg class="ic"><use href="#i-stop-fill"/></svg>';
    sendBtn.title = '停止';
    sendBtn.classList.add('stop');
    return;
  }
  sendBtn.innerHTML = '<svg class="ic"><use href="#i-arrow-up"/></svg>';
  sendBtn.title = busyNow ? '引导（把这句话插进正在跑的一轮）' : '发送';
  sendBtn.classList.remove('stop');
}

// 引导：不打断正在跑的这一轮，把新要求插进去
async function steer() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  saveDraft();
  paintSend();
  try {
    const r = await apiPost('steer', { text });
    if (r.ok) { buzz(15); toast('已引导，它会带着这句继续'); remoteReload(true); }
    else {
      const d = await r.json().catch(() => ({}));
      toast(d.error || '引导没有成功');
    }
  } catch (e) { toast('引导失败：' + e.message); }
}

// 上一轮被打断 / 出错时给一条"继续"（和 Codex 桌面版同一个形态）。
// 状态由服务端 threads/read 的 lastStatus 给出。
function paintContinue(status) {
  const bar = $('contbar');
  if (!bar) return;
  const need = status === 'interrupted' || status === 'failed';
  bar.classList.toggle('on', need);
  const b = $('cont-btn');
  if (b && need) b.textContent = (status === 'failed' ? '上一轮出错了' : '上一轮被打断了') + ' · 继续';
}

// 用线程自己的状态校准"这条对话在不在跑"。
//
// lastStatus 是 app-server 里的权威状态（inProgress / completed / interrupted），
// 不依赖某一条通知有没有送到手机上。切对话、通知丢了、甚至服务重启过，
// 只要回到这条对话读一次历史，就能把"正在生成"的反馈重新挂回来 ——
// 这正是"明明还在跑，手机上却跟停了一样"的兜底。
function applyThreadRun(status) {
  if (status === 'inProgress') {
    remoteRunning = true;
    lastRunVerifyAt = Date.now();
    if (!liveRunAt) liveRunAt = Date.now();
    liveTickStart();
  } else if (status === 'completed' || status === 'interrupted' || status === 'failed') {
    // 明确读到"这一轮结束了"才收；读不到（网络抖、接口异常）就当不知道，
    // 别把正在跑的提示条误撤掉。
    if (running) return;
    remoteRunning = false;
    hideGenerating();
  }
}

// "任务耗时 X 分 Y 秒"：做成居中的小胶囊，点 × 可以收起来（桌面端也是这个形态）
function addElapsedNote(ms) {
  ms = Number(ms || 0);
  if (!ms || ms < 3000) return;
  const d = document.createElement('div');
  d.className = 'elapsedchip';
  d.innerHTML = '<span>任务耗时 ' + fmtElapsed(ms) + '</span>' +
    '<button class="x" aria-label="收起">×</button>';
  d.querySelector('.x').addEventListener('click', () => d.remove());
  logEl.appendChild(d);
  scrollDown();
}

// 一轮刚结束时（手机上自己发的那一轮）就地显示用时。
//
// 记住"已经报过哪个开始时间"，同一个只报一条。为什么要去重：app-server
// 那边要是把 turn 挂在 inProgress 上不放（2026-10-11 那个"两轮并进一个
// turn"的毛病就会这样），而服务端这边其实已经收工，两边状态一打架，
// 这个函数就会被一秒一次地叫起来，手机上刷出一整屏
// "任务耗时 44 秒 / 45 秒 / 46 秒…"。
let lastElapsedStart = 0;
function noteElapsed(startAt) {
  const at = Number(startAt || 0);
  if (!at || at === lastElapsedStart) return;
  lastElapsedStart = at;
  addElapsedNote(Date.now() - at);
}
// 草稿按对话各自记住：切走再切回来、甚至 App 被杀掉，没发出去的字都还在。
const draftKey = () => 'draft:' + (openId || '');
function saveDraft() {
  try {
    if (inputEl.value) localStorage.setItem(draftKey(), inputEl.value);
    else localStorage.removeItem(draftKey());
  } catch (_) {}
}
function loadDraft() {
  try { inputEl.value = localStorage.getItem(draftKey()) || ''; } catch (_) {}
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 132) + 'px';
}
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 132) + 'px';
  saveDraft();
  paintSend();   // 正在跑的时候：有字变"引导"，没字是"停止"
});
// 键盘弹起时安卓会顺手把整页往上顶，顶栏因此被推走；
// 这里把文档按住，只让输入框和消息区各自滚动。
inputEl.addEventListener('focus', () => {
  if (window.scrollY) window.scrollTo(0, 0);
  setTimeout(() => { scrollDown(); if (window.scrollY) window.scrollTo(0, 0); }, 260);
});
window.addEventListener('scroll', () => { if (window.scrollY) window.scrollTo(0, 0); }, { passive: true });

/* ---------- 离线发件箱：没发出去先存手机里，网一通就自动补发 ---------- */
let outbox = [];
try { outbox = JSON.parse(localStorage.getItem('outbox-v1') || '[]'); } catch (_) { outbox = []; }
function saveOutbox() { try { localStorage.setItem('outbox-v1', JSON.stringify(outbox)); } catch (_) {} }
function queuedFor(sid) { return outbox.filter((q) => q.sessionId === sid); }
function enqueueOutbox(item) {
  if (!outbox.some((q) => q.cid === item.cid)) { outbox.push(item); saveOutbox(); }
}
function dequeueOutbox(cid) {
  const n = outbox.filter((q) => q.cid !== cid);
  if (n.length !== outbox.length) { outbox = n; saveOutbox(); }
}
const queuedText = (it) => (it.atts && it.atts.length)
  ? (it.text ? it.text + '\n' : '') + it.atts.map((a) => '附件：' + a.name).join('\n')
  : (it.text || '');
const newClientId = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// 服务端现在是不是正在跑这条对话。手机自己发的那一轮也算（所以 desk 那条也认）：
// 人一旦离开界面，那一轮就只剩服务端知道它在跑了。
function sessionRunningHere(sid) {
  if (!sid) return false;
  if (runState && runState.sessionId === sid) return true;
  if (deskRun && deskRun.sessionId === sid) return true;
  const s = (state.sessions || []).find((x) => x.id === sid);
  return !!(s && s.threadId && runThreads[s.threadId]);
}

// 自动重发最多试几次。到顶就停手、只认手动点 —— 一直转圈比一次失败更让人难受。
const MAX_AUTO_TRY = 5;
function bumpOutboxTries(item) {
  item.tries = (item.tries || 0) + 1;
  const it = outbox.find((q) => q.cid === item.cid);
  if (it && it !== item) it.tries = item.tries;
  saveOutbox();
  return item.tries;
}
function resetOutboxTries(cid) {
  const it = outbox.find((q) => q.cid === cid);
  if (!it) return;
  it.tries = 0;
  saveOutbox();
}

// 把一条自己的消息变成"等待发送"的虚线气泡：点一下立刻重发，长按丢弃。
//
// 三种状态要分清楚，弄错了用户就会看到"电脑上明明跑得好好的，手机却一直说没发出去"：
//   - 这一轮还在电脑上跑：那就是**已经送到了**，等它跑完就行；
//   - 自动重发试够了：停手，等用户点一下；
//   - 其余：断网等待，联网自动重发。
function markBubblePending(b, item) {
  if (!b || b.classList.contains('pending')) return;
  b.classList.add('pending');
  const runningHere = sessionRunningHere(item.sessionId);
  const tries = item.tries || 0;
  let icon = ico('circle-notch', 'spin');
  let text = '没发出去，联网后自动重发 · 点此立即重发 · 长按丢弃';
  if (runningHere) {
    text = '已经发到电脑上了，正在跑 · 跑完这里会自动出来';
  } else if (tries >= MAX_AUTO_TRY) {
    icon = ico('warning-circle');
    text = '没发出去（已试 ' + tries + ' 次）· 点此再试 · 长按丢弃';
  }
  const tag = document.createElement('div');
  tag.className = 'qtag';
  tag.innerHTML = icon + '<span>' + esc(text) + '</span>';
  b.appendChild(tag);
  let timer = 0;
  b.addEventListener('click', () => {
    if (!b.classList.contains('pending')) return;
    resetOutboxTries(item.cid);   // 手动点了就重新给满次数
    flushOutbox(item.sessionId);
  });
  b.addEventListener('touchstart', () => {
    timer = setTimeout(() => {
      if (!b.classList.contains('pending')) return;
      dequeueOutbox(item.cid);
      const row = b.closest('.mrow'); if (row) row.remove();
      toast('已丢弃这条没发出去的消息');
    }, 650);
  }, { passive: true });
  const cancel = () => clearTimeout(timer);
  b.addEventListener('touchend', cancel);
  b.addEventListener('touchmove', cancel, { passive: true });
}

// 历史整块重画后，把当前对话里没发出去的消息补在末尾。
function paintQueued() {
  logEl.querySelectorAll('.bubble.pending').forEach((b) => { const r = b.closest('.mrow'); if (r) r.remove(); });
  if (!openId) return;
  queuedFor(openId).forEach((item) => {
    const row = document.createElement('div');
    row.className = 'mrow me';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.dataset.cid = item.cid;
    b.textContent = queuedText(item);
    row.appendChild(b);
    logEl.appendChild(row);
    markBubblePending(b, item);
  });
}

// 补发只动"当前打开的这条对话"，绝不后台把用户正在看的界面切走。
// 一轮只能发一条（第二条服务端会按"上一轮还没结束"挡回），所以一次补一条。
let flushing = false;
// 这条消息其实早就送到了？看手上的历史里有没有它。
//
// 这是"补发"最后一道闸：openChat 里补发发生在读历史之前，而服务端的去重标记
// 会因为服务重启丢掉（每次换装都重启）。所以重发之前先看一眼本地缓存的历史 ——
// 上面已经有这条一样的话，就说明送到了，直接从发件箱摘掉，绝不再发一遍。
function alreadyInHistory(sessionId, item) {
  const s = (state.sessions || []).find((x) => x.id === sessionId) || {};
  const msgs = (s.threadId ? readMsgs('t-' + s.threadId) : null) || readMsgs('s-' + sessionId) || [];
  let last = null;
  for (let i = msgs.length - 1; i >= 0; i--) {
    if (msgs[i] && msgs[i].role === 'user' && msgs[i].text) { last = msgs[i]; break; }
  }
  if (!last) return false;
  if (String(last.text).trim() !== String(item.text || '').trim()) return false;
  const ts = Number(last.ts) || 0;
  if (!ts || !item.at) return true;   // 没时间戳就按内容认，宁可少发一次
  return ts >= item.at - 120000;
}

async function flushOutbox(sid) {
  const sessionId = sid || openId;
  // 这一轮还在电脑上跑：那条其实已经送到了，等它跑完；别在这里反复重发
  if (flushing || !sessionId || running || remoteRunning || sessionRunningHere(sessionId)) return;
  const item = outbox.find((q) => q.sessionId === sessionId);
  if (!item) return;
  if (alreadyInHistory(sessionId, item)) {
    // 历史里已经有了：早就送到了，摘掉就行（这次重发就是之前那次重复发送的来源）
    dequeueOutbox(item.cid);
    renderChats();
    return;
  }
  if ((item.tries || 0) >= MAX_AUTO_TRY) return;   // 自动重发试够了，只认手动点
  flushing = true;
  try { await submitMessage(item, { fromQueue: true }); }
  finally { flushing = false; }
}

async function send() {
  const text = inputEl.value.trim();
  const atts = pendingAtts.filter((a) => a.path);
  if ((!text && !atts.length) || running) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  saveDraft();
  // 附件已经传到电脑上了，清掉列表；这一轮用刚才记下的那份
  if (atts.length) { pendingAtts = []; renderAtts(); }
  const item = {
    cid: newClientId(),
    sessionId: state.activeId || '',
    text,
    atts: atts.map((a) => ({ path: a.path, name: a.name, image: a.image })),
    at: Date.now(),
  };
  await submitMessage(item, { fromQueue: false });
}

async function submitMessage(item, opts) {
  const fromQueue = !!opts.fromQueue;
  const sendingId = item.sessionId;
  // 补发：先拿掉旧的虚线气泡，重画一条正常的自己消息；再失败会重新变虚线。
  const oldPending = logEl.querySelector('.bubble.pending[data-cid="' + item.cid + '"]');
  if (oldPending) { const rr = oldPending.closest('.mrow'); if (rr) rr.remove(); }
  addUser(queuedText(item));
  const mine = logEl.querySelectorAll('.mrow.me .bubble');
  const userBubble = mine[mine.length - 1] || null;
  if (userBubble) userBubble.dataset.cid = item.cid;
  stopped = false;
  if (sendingId) runningIds.add(sendingId);
  setRunning(true);
  // 秒表从点发送就开始走：长任务（比如 6 分 47 秒）也能看得见
  liveRunAt = Date.now();
  setLiveActivity('正在思考');
  liveTickStart();
  const title = (state.active || {}).title || 'Codex';

  let bubble = null, actsWrap = null, deltaBuf = '', raf = false, hadError = false;
  // 每来一小段就整段重画一次太亏：一次重画要把整篇 markdown 重新解析、重新排版。
  // 增量本来就是按网络来回成批到的（公网一趟 0.4 秒），这里再限到 80 毫秒一档，
  // 看着一样是"边写边出"，但同一段文字不会被反复重画。
  let lastPaint = 0, paintTimer = null;
  const paint = () => {
    if (raf) return;
    const wait = 80 - (Date.now() - lastPaint);
    if (wait > 0) {
      if (!paintTimer) {
        paintTimer = setTimeout(() => { paintTimer = null; paint(); }, wait);
      }
      return;
    }
    raf = true;
    requestAnimationFrame(() => {
      raf = false;
      lastPaint = Date.now();
      if (bubble) { bubble.innerHTML = renderMarkdown(deltaBuf); scrollDown(); }
    });
  };

  const isQueued = () => outbox.some((q) => q.cid === item.cid);

  try {
    const resp = await api('send', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: item.text,
        attachments: item.atts.map((a) => ({ path: a.path, name: a.name, image: a.image })),
        clientId: item.cid,
        // 必须写明发到哪条：不然补发会落到"当前活跃"的那条对话里，
        // 用户切一下对话，上一条消息就被发到别的对话去了
        sessionId: item.sessionId || sendingId || '',
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: 'HTTP ' + resp.status }));
      if (err.duplicate) {
        // 上一次其实已经送到、电脑上正在跑：补发到此为止，内容等历史补回来。
        dequeueOutbox(item.cid);
        buzz(15);
        toast('这条已经在电脑上跑了');
        if (fromQueue) reloadOpenChat();
        hadError = false;
        return;
      }
      // 断网、忙线、服务端报错：都先收进发件箱，能发的时候它会自己出去。
      bumpOutboxTries(item);   // 记一次尝试，免得永远自动重试下去
      enqueueOutbox(item);
      markBubblePending(userBubble, item);
      hadError = true;
      buzz(60);   // 出错给长一点的振动，和"已发出"区分开
      return;
    }
    dequeueOutbox(item.cid);   // 服务端真收到了，发件箱里不用再留
    buzz(15);     // 已发出：轻轻确认一下
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line) continue;
        let evt; try { evt = JSON.parse(line); } catch (_) { continue; }
        if (evt.type === 'delta') {
          setLiveActivity('正在写回答');
          if (!bubble) { bubble = addAssistant('', null); bubble.classList.add('caret'); }
          deltaBuf += evt.text || '';
          paint();
        } else if (evt.type === 'approval') {
          renderApproval(evt);
        } else if (evt.type === 'question') {
          renderQuestion(evt);
        } else if (evt.type === 'fileChange') {
          // 一次运行可能改很多文件：这里先记账，等这一轮结束汇总成一张卡
          turnFiles = Math.max(turnFiles, Number(evt.files) || 0);
          turnAdded += Number(evt.added) || 0;
          turnRemoved += Number(evt.removed) || 0;
        } else if (evt.type === 'message') {
          if (!bubble) bubble = addAssistant('', null);
          if (evt.text) deltaBuf = evt.text;
          bubble.innerHTML = renderMarkdown(deltaBuf);
          bubble.classList.add('caret');
          attachCopy(bubble);
          scrollDown();
        } else if (evt.type === 'tool') {
          setLiveActivity('正在执行：' + (evt.text || ''));
          if (!actsWrap) { actsWrap = document.createElement('div'); actsWrap.className = 'acts'; logEl.appendChild(actsWrap); }
          const d = document.createElement('div');
          d.className = 'act';
          d.textContent = '> ' + evt.text;
          actsWrap.appendChild(d);
          scrollDown();
        } else if (evt.type === 'reasoning') {
          setLiveActivity('正在思考');
          if (!bubble) { bubble = addAssistant('', null); bubble.classList.add('caret'); }
        } else if (evt.type === 'working' && !bubble) {
          setLiveActivity('正在思考');
          bubble = addAssistant('', null); bubble.classList.add('caret');
        } else if (evt.type === 'error') {
          hadError = true;
          renderErrorCard(evt.text || '这一轮出错了');
        }
      }
    }
  } catch (err) {
    // 连接没走完（断网 / 切后台 / 信号断流）：先收进发件箱。服务端可能已经
    // 收到并在跑，补发时靠 clientId 幂等挡回，绝不会把同一句话再跑一遍。
    hadError = true;
    enqueueOutbox(item);
    markBubblePending(userBubble, item);
  } finally {
    if (bubble) bubble.classList.remove('caret');
    if (!bubble && !stopped && !isQueued()) {
      addAssistant('<span style="color:var(--faint)">这一轮没有返回内容</span>');
    }
    if (sendingId) runningIds.delete(sendingId);
    refreshRunning();
    if (liveRunAt) noteElapsed(liveRunAt);
    // 这一轮的文件改动，最后汇总成一张卡
    if (turnFiles || turnAdded || turnRemoved) {
      renderFileChange({ files: turnFiles, added: turnAdded, removed: turnRemoved });
      turnFiles = 0; turnAdded = 0; turnRemoved = 0;
    }
    hideGenerating();
    liveRunAt = 0;
    setLiveActivity('');
    // 人不在看的时候，用系统通知告诉你（还在发件箱等重发的不算）
    if (document.hidden && !isQueued()) {
      const n = native();
      const body = (deltaBuf || '').replace(/```[\s\S]*?```/g, ' [代码] ').replace(/\s+/g, ' ').slice(0, 120);
      if (n && n.notify) n.notify(hadError ? '任务结束但出错了' : '任务完成', title, body);
    }
    await refresh();
    const now = state.active || {};
    const nt = chatThread(now);
    $('chat-title').textContent = chatTitle(now);
    $('chat-path').textContent = dirLabel(now, nt);
  }
}
sendBtn.addEventListener('click', () => {
  const busyNow = running || remoteRunning;
  if (!busyNow) return send();
  if (inputEl.value.trim()) return steer();   // 有字就引导
  apiPost('stop', {});                        // 没字就停止
});
// "继续"：把"继续"当作一句话发出去，走的就是正常发送那条路
$('cont-btn').addEventListener('click', () => {
  if (running || remoteRunning) return;
  inputEl.value = '继续';
  inputEl.style.height = 'auto';
  send();
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !running) { e.preventDefault(); send(); }
});

  $('mon-back').addEventListener('click', closeMon);

/* ---------- 服务 ---------- */
function renderServices() {
  // ntfy 是"要看消息流"的东西，不是一个网页入口，所以不放这里。
  const list = (state.services || []).filter((s) => !s.group && !/ntfy/i.test(s.url));
  // 电脑状态是内置的（数据来自电脑端自己），不是外部服务入口，所以不跟着删
  let h = '<div class="tiles">' +
    '<button class="tile" id="mon-open"><span class="ti">' + ico('gauge') + '</span>' +
    '<span class="tn">电脑状态</span>' +
    '<span class="td" id="mon-tile-sub">CPU · 内存 · 磁盘 · 网络</span></button>';
  list.forEach((s) => {
    let host = s.url;
    try { host = new URL(s.url).host; } catch (_) {}
    h += '<button class="tile" data-url="' + esc(s.url) + '" data-id="' + esc(s.id) + '">' +
      '<span class="ti">' + ico(s.icon || 'desktop') + '</span>' +
      '<span class="tn">' + esc(s.name) + '</span>' +
      '<span class="td">' + esc(host) + '</span></button>';
  });
  h += '<button class="tile add" id="addsvc"><span class="ti">' + ico('plus') + '</span><span class="tn">添加</span></button>';
  h += '</div>';
  if (!list.length) {
    h = '<div class="group"><div class="empty">' + ico('squares-four') +
      '<div class="e1">还没有自己的服务</div><div class="e2">点「添加」加一个 tailnet 里的网址</div></div></div>' +
      '<div class="tiles">' +
      '<button class="tile" id="mon-open"><span class="ti">' + ico('gauge') + '</span>' +
      '<span class="tn">电脑状态</span>' +
      '<span class="td" id="mon-tile-sub">CPU · 内存 · 磁盘 · 网络</span></button>' +
      '<button class="tile add" id="addsvc"><span class="ti">' + ico('plus') + '</span><span class="tn">添加</span></button></div>';
  }
  $('services-body').innerHTML = h;

  $('mon-open').addEventListener('click', openMon);
  // 磁贴副标题顺手带一眼当前负载，点进去之前就知道电脑忙不忙
  api('sysinfo').then((r) => (r.ok ? r.json() : null)).then((d) => {
    if (!d || d.error) return;
    const el = $('mon-tile-sub');
    if (el) el.textContent = 'CPU ' + Math.round(Number(d.cpu) || 0) + '% · 内存 ' + Math.round(pctOf(d.memUsed, d.memTotal)) + '%';
  }).catch(() => {});

  document.querySelectorAll('.tile[data-url]').forEach((el) => {
    let timer = null;
    el.addEventListener('click', () => openUrl(el.dataset.url, el.dataset.id));
    el.addEventListener('touchstart', () => { timer = setTimeout(() => askRemoveService(el.dataset.id), 650); }, { passive: true });
    el.addEventListener('touchend', () => clearTimeout(timer));
    el.addEventListener('touchmove', () => clearTimeout(timer));
  });
  $('addsvc').addEventListener('click', () => openSheet('<h3>添加服务</h3>' +
    '<label>名称</label><input id="s-name" placeholder="路由器">' +
    '<label>地址</label><input id="s-url" placeholder="https://xxx.tailxxxx.ts.net" autocapitalize="off" inputmode="url">' +
    '<label>说明</label><input id="s-desc" placeholder="备注，可留空">' +
    '<div class="actions"><button id="s-cancel">取消</button><button class="go" id="s-ok">添加</button></div>', () => {
    $('s-cancel').addEventListener('click', closeSheet);
    $('s-ok').addEventListener('click', async () => {
      const r = await apiPost('services/add', {
        name: $('s-name').value.trim(), url: $('s-url').value.trim(), desc: $('s-desc').value.trim(),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { toast(d.error || '添加失败'); return; }
      state.services = d.services; closeSheet(); renderServices(); toast('已添加');
    });
  }));
}
function askRemoveService(id) {
  const svc = (state.services || []).find((s) => s.id === id);
  if (!svc) return;
  openSheet('<h3>移除「' + esc(svc.name) + '」</h3><div class="desc">只是从列表里去掉。</div>' +
    '<div class="actions"><button id="r-no">取消</button><button class="no" id="r-yes">移除</button></div>', () => {
    $('r-no').addEventListener('click', closeSheet);
    $('r-yes').addEventListener('click', async () => {
      const r = await apiPost('services/delete', { id });
      const d = await r.json().catch(() => ({}));
      state.services = d.services || []; closeSheet(); renderServices(); toast('已移除');
    });
  });
}
function openUrl(u, id) {
  const svc = (state.services || []).find((s) => s.id === id);
  const n = native();
  // 手机进不了 tailnet 内部地址，必须走电脑中转。反代是要口令的，
  // 拼地址时得把口令带上，否则打开就是"403 链接无效或已过期"。
  let target = u;
  if (svc && svc.proxy) {
    const url = new URL(svc.proxy, location.origin);
    url.searchParams.set('k', TOKEN);
    target = url.toString();
  }
  if (n && n.openUrl) n.openUrl(target, svc ? svc.name : '');
  else window.open(target, '_blank');
}

let monTimer = null, monBusy = false, monBuilt = false;

// 图表配色跟着页面走，别在 JS 里写死两套
function themeColor(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || '#69c497';
}

function fmtBytes(n) {
  n = Number(n) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(n < 10 ? 1 : 0)) + ' ' + u[i];
}
function fmtDur(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  if (d) return d + ' 天 ' + h + ' 小时';
  if (h) return h + ' 小时 ' + m + ' 分';
  return m + ' 分';
}
const pctOf = (used, total) => (total ? Math.min(100, (used / total) * 100) : 0);
const barOf = (pct) => '<div class="bar"><i class="' + (pct >= 85 ? 'warn' : '') + '" style="width:' +
  Math.max(1.5, Math.min(100, pct)).toFixed(1) + '%"></i></div>';

const clockOf = (ms) => {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
};
// 纵轴上限取个整数（1 / 2 / 5 打头），免得每来一个点轴就跳一下
function niceMax(v) {
  if (!(v > 0)) return 1;
  const exp = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / exp;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * exp;
}

/* 图表统一走 Chart.js（MIT，随电脑端一起发出去，不依赖外网 CDN）。
   配色、网格、提示框都在这里定一次，三张图长一个样。 */
function monChartOptions(max) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#24262c', borderColor: '#2a2c33', borderWidth: 1,
        titleColor: '#9a9ca3', bodyColor: '#e6e7e9', displayColors: false,
        padding: 8, cornerRadius: 8, caretSize: 4, caretPadding: 6,
        callbacks: {
          label: (c) => (c.dataset.label ? c.dataset.label + ' ' : '') +
            (c.dataset.human ? fmtBytes(c.parsed.y) + '/s' : c.formattedValue + (c.dataset.unit || '')),
        },
      },
    },
    scales: {
      x: { display: false },
      y: {
        beginAtZero: true, suggestedMax: max || undefined,
        ticks: { display: false }, border: { display: false },
        grid: { color: 'rgba(255,255,255,.06)', drawTicks: false },
      },
    },
    elements: { point: { radius: 0, hitRadius: 10 }, line: { borderWidth: 1.6, tension: .35 } },
  };
}
function monChart(canvasId, series, max) {
  const el = $(canvasId);
  if (!el || !window.Chart) return null;   // 脚本没加载出来就退化成纯数字
  const ch = new Chart(el, {
    type: 'line',
    data: {
      labels: [],
      datasets: series.map((s) => ({
        label: s.label || '', data: [], unit: s.unit || '', human: !!s.human,
        borderColor: s.color, backgroundColor: s.fill || 'transparent', fill: !!s.fill,
      })),
    },
    options: monChartOptions(max),
  });
  ch.__fixedMax = !!max;   // CPU 固定 0-100，其余按窗口峰值自适应
  return ch;
}
function monChartData(ch, labels, series) {
  if (!ch) return;
  if (!ch.__fixedMax) {
    let top = 0;
    series.forEach((vals) => vals.forEach((v) => { if (v > top) top = v; }));
    ch.options.scales.y.suggestedMax = niceMax(top);
  }
  ch.data.labels = labels;
  series.forEach((vals, i) => { if (ch.data.datasets[i]) ch.data.datasets[i].data = vals; });
  ch.update('none');
}
function setText(id, s) {
  const el = $(id);
  if (el && el.textContent !== s) el.textContent = s;
}
function setVal(id, s, warn) {
  const el = $(id);
  if (!el) return;
  if (el.textContent !== s) el.textContent = s;
  el.classList.toggle('warn', !!warn);
}
function setBar(id, pct) {
  const el = $(id);
  if (!el) return;
  el.style.width = Math.max(1.5, Math.min(100, pct)).toFixed(1) + '%';
  el.classList.toggle('warn', pct >= 85);
}
function renderCores(list) {
  const box = $('cpu-cores');
  if (!box) return;
  if (box.childElementCount !== list.length) {
    box.innerHTML = list.map(() => '<i><b></b></i>').join('');
  }
  for (let i = 0; i < box.children.length; i++) {
    const v = Math.min(100, Math.max(0, Number(list[i]) || 0));
    const fill = box.children[i].firstElementChild;
    fill.style.height = Math.max(4, v).toFixed(1) + '%';
    fill.classList.toggle('warn', v >= 85);
    box.children[i].title = '核心 ' + (i + 1) + ' · ' + Math.round(v) + '%';
  }
}

async function loadMon() {
  if (monBusy) return;
  monBusy = true;
  try {
    const r = await api('sysinfo');
    const d = await r.json();
    if (d && !d.error) { renderMon(d); return; }
    throw new Error(d && d.error ? d.error : 'bad payload');
  } catch (_) {

}

function renderMon(d) {
  buildMon();
  const hist = d.history || [];
  const stamps = hist.map((s) => clockOf(s.at));
  const num = (v) => Number(v) || 0;

  // CPU：总量 + 每核小柱
  const cpu = num(d.cpu);
  setVal('v-cpu', Math.round(cpu) + '%', cpu >= 85);
  monChartData(monCharts.cpu, stamps, [hist.map((s) => num(s.cpu))]);
  renderCores(d.perCore || []);
  setText('t-cpu', (d.cores || 0) + ' 核 · 最近一分钟');

  // 显卡：没有 N 卡就把这张卡收起来，不占地方
  const gpuCard = document.querySelector('.mcard[data-card="gpu"]');
  const gpus = d.gpus || [];
  if (gpuCard) {
    gpuCard.style.display = gpus.length ? '' : 'none';
    if (gpus.length) {
      const g = gpus[0];
      setVal('v-gpu', Math.round(num(g.util)) + '%', num(g.util) >= 90);
      const name = String(g.name || '').replace(/^NVIDIA\s+/i, '');
      setText('u-gpu', (gpus.length > 1 ? gpus.length + ' 张卡 · ' : '') + name);
      setBar('b-gpu', pctOf(g.memUsed, g.memTotal));
      setText('t-gpu', '显存 ' + fmtBytes(g.memUsed) + ' / ' + fmtBytes(g.memTotal) +
        (g.temp ? ' · ' + Math.round(num(g.temp)) + '°C' : ''));
    }
  }

  // 内存
  const memPct = pctOf(d.memUsed, d.memTotal);
  setVal('v-mem', Math.round(memPct) + '%', memPct >= 85);
  setText('u-mem', fmtBytes(d.memUsed) + ' / ' + fmtBytes(d.memTotal));
  setBar('b-mem', memPct);
  setText('t-mem', d.swapTotal ? '页面文件 ' + fmtBytes(d.swapUsed) + ' / ' + fmtBytes(d.swapTotal) : '');

  // 磁盘：容量 + 读写速率
  const disks = d.disks || [];
  $('disk-list').innerHTML = disks.map((dk) => {
    const used = Math.max(0, num(dk.total) - num(dk.free));
    const pct = pctOf(used, dk.total);
    return '<div class="draw"><span class="dn">' + esc(dk.name) + '</span>' +
      '<span class="dv">' + fmtBytes(used) + ' / ' + fmtBytes(dk.total) + '</span></div>' + barOf(pct);
  }).join('');
  const ioNote = d.ioNote || '';
  $('disk-io').innerHTML = '<span class="kn">读写</span><span class="kv2">' +
    (ioNote ? esc(ioNote) : '↓ ' + fmtBytes(d.ioRead) + '/s · ↑ ' + fmtBytes(d.ioWrite) + '/s') + '</span>';
  const ioChart = $('disk-io').nextElementSibling;
  if (ioChart) ioChart.style.display = ioNote ? 'none' : '';
  if (!ioNote) {
    monChartData(monCharts.io, stamps, [hist.map((s) => num(s.ioRead)), hist.map((s) => num(s.ioWrite))]);
  }

  // 网络：总量 + 每张在用的网卡
  const nics = d.nics || [];
  $('net-list').innerHTML = nics.slice(0, 4).map((n) =>
    '<div class="draw"><span class="dn">' + esc(n.name) + '</span>' +
    '<span class="dv">↓ ' + fmtBytes(n.rx) + '/s · ↑ ' + fmtBytes(n.tx) + '/s</span></div>').join('');
  // 只有一张网卡时，标题上那行和下面那行数字一样，就不重复了
  setText('u-net', nics.length > 1 ? '↓ ' + fmtBytes(d.netRx) + '/s · ↑ ' + fmtBytes(d.netTx) + '/s' : '');
  setText('t-net', '开机以来 ↓ ' + fmtBytes(d.netRxTotal) + ' · ↑ ' + fmtBytes(d.netTxTotal));
  monChartData(monCharts.net, stamps, [hist.map((s) => num(s.netRx)), hist.map((s) => num(s.netTx))]);

  // 进程
  $('proc-list').innerHTML = (d.procs || []).map((p) =>
    '<div class="mproc"><span class="pn">' + esc(p.name) + '</span>' +
    (p.n > 1 ? '<span class="pc">×' + p.n + '</span>' : '') +
    '<span class="pm">' + fmtBytes(p.mem) + '</span></div>').join('');

  // 底下那行：谁、开了多久、什么时候刷的
  setText('f-host', d.host || '这台电脑');
  setText('f-up', '已开机 ' + fmtDur(d.uptime));
  setText('f-at', '每 2 秒自动刷一次 · ' + clockOf(d.at));
  $('mon-sub').textContent = (d.host || '') + ' · 已开机 ' + fmtDur(d.uptime);
}

// 电脑让手机做的事（抓图 / 传日志 / 清日志）。
// 手机端不放按钮——这些都从电脑那边发起，手机每轮刷新时问一次。
function runPhoneCmd(cmd) {
  const x = native();
  // 电脑派来的动作是一个 JSON 字符串（{"action":...}），先还原成对象
  if (typeof cmd === 'string' && cmd.charAt(0) === '{') {
    try { cmd = JSON.parse(cmd); } catch (_) {}
  }
  // 电脑可以派"动作"过来：打开抽屉、点某个按钮、填输入框……
  // 这样我能在电脑上完全模拟你的操作，自己点、自己看，不用来回描述。
  if (cmd && typeof cmd === 'object' && cmd.action) { runRemoteAction(cmd); return; }
  if (!x) return;
  if (cmd === 'shot' && x.screenshot) toast(x.screenshot('电脑要求'));
  else if (cmd === 'log' && x.sendLog) toast(x.sendLog());
  else if (cmd === 'clear' && x.clearLog) x.clearLog();
}

// 电脑派来的页面动作。每一条都尽量用"像人点一样"的方式：直接触发元素的 click，
// 这样走的是和你手指完全相同的代码路径。
function runRemoteAction(a) {
  const log = (m) => { const n = native(); if (n && n.log) n.log('remote', m); };
  try {
    let el = null;
    switch (a.action) {
      case 'reload':
        log('reload');
        location.reload();
        return;
      case 'openDrawer':
        // 列表已经是主屏，"打开抽屉"等价于回到列表
        if (typeof closeChat === 'function') closeChat();
        break;
      case 'closeDrawer':
        if (typeof closeDrawer === 'function') closeDrawer();
        break;
      case 'tab':
        el = document.querySelector('nav button[data-tab="' + a.name + '"]');
        if (el) el.click();
        break;
      case 'openChat': {
        const s = (state.sessions || []).find((x) => x.title && x.title.includes(a.text || ''));
        if (s) { closeDrawer(); openChat(s.id); }
        break;
      }
      case 'click':
        el = document.querySelector(a.sel || '');
        if (el) el.click();
        break;
      case 'type':
        el = document.querySelector(a.sel || '');
        if (el) { el.value = a.text || ''; el.dispatchEvent(new Event('input', { bubbles: true })); }
        break;
      case 'scrollTop': {
        const sc = a.sel ? document.querySelector(a.sel) : null;
        if (sc) sc.scrollTop = 0;
        break;
      }
      default:
        log('未知动作: ' + a.action);
        return;
    }
    log('动作 ' + a.action + (a.sel ? (' ' + a.sel) : '') + ' → ' + (el ? '已执行' : '没找到目标'));
  } catch (e) {
    log('动作失败: ' + e.message);
  }
}
function permLabel(s) {
  const sandbox = { 'read-only': '只读', 'workspace-write': '可改文件', 'danger-full-access': '完全放开' }[s.sandbox] || s.sandbox || '默认';
  const approval = { 'on-request': '需要时问我', untrusted: '多数动作都问', never: '从不问' }[s.approval] || s.approval || '';
  return approval ? sandbox + ' · ' + approval : sandbox;

  const t = state.tasks || {};
  const parts = [];
  if (f.on) parts.push('服务器通知已开');
  if (n.channel && n.channel !== 'none') {
    parts.push(({ serverchan: 'Server酱', pushplus: 'PushPlus', wecom: '企业微信', ntfy: 'ntfy', custom: '自定义' })[n.channel] || n.channel);
  }
  if (t.on) parts.push('任务播报已开');
  if (n.onDone) parts.push('完成后提醒');
  if (n.onApproval) parts.push('审批时提醒');
  return parts.length ? parts.join(' · ') : '都关着';
}
/* 第三方推送渠道。每个渠道要填什么不一样，写清楚就不用一个个试。 */
const CHANNELS = [
  ['none', '不推送', '只在 App 里看，不打扰微信', 'bell'],
  ['serverchan', 'Server酱', '微信收到推送，填 SendKey', 'paper-plane-tilt'],
  ['pushplus', 'PushPlus', '微信收到推送，填 token', 'paper-plane-tilt'],
  ['wecom', '企业微信群机器人', '填完整的 Webhook 地址', 'chat-circle-dots'],
  ['ntfy', 'ntfy 频道', '填频道地址，手机用同一个', 'bell'],
  ['custom', '自定义地址', '自己搭的接口，直接 POST', 'desktop'],
];
const CHANNEL_FIELD = {
  serverchan: ['SendKey', '在 sct.ftqq.com 拿，形如 SCTxxxxxx', 'SCT...'],
  pushplus: ['Token', '在 pushplus.plus 拿，一串 32 位字符', '你的 token'],
  wecom: ['Webhook 地址', '群机器人里复制整条地址', 'https://qyapi.weixin.qq.com/...'],
  ntfy: ['频道地址', '比如 https://ntfy.sh/你的频道名', 'https://ntfy.sh/...'],

};

/* 让手机原生也去订阅同一个频道：App 退到后台甚至被关掉，通知照样到。 */
function syncNtfy() {
  const x = native();
  if (!x || !x.setNtfy) return;
  const f = state.feed || {};
  const fallback = ((state.services || []).find((s) => /ntfy/i.test(s.url)) || {}).url || '';
  const url = f.url || fallback;
  const on = !!f.on;
  // 只在真的变了才通知原生，否则每次打开 App 都会弹一次"开始接收通知"
  const last = readLast().ntfy || {};
  if (last.url === url && last.on === on) return;
  writeLast({ ntfy: { url, on } });
  try { x.setNtfy(url, on); } catch (_) {}
}

async function toggleNtfy() {
  const feed = state.feed || {};
  const url = $('n-ntfy-url') ? $('n-ntfy-url').value.trim() : (feed.url || '');
  const iv = $('n-ntfy-int') ? (parseInt($('n-ntfy-int').value, 10) || 30) : (feed.interval || 30);
  if (!feed.on && !url) { toast('先填频道地址'); return; }
  const next = !feed.on;
  const r = await apiPost('notify/watch?refresh=1', { url, on: next, interval: iv });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.error || '没设置成功'); return; }
  state.feed = d.state;
  closeSheet();
  await refresh();
  syncNtfy();
  renderMe();
  toast(next ? '电脑开始替你收通知了' : '已停止接收');
  if (next) switchTab('feed');
}

async function checkUpdate() {
  const n = native();
  if (!n) { toast('请在安装的 App 里使用'); return; }
  let info = {};
  try {
    const r = await api('app/version');
    info = await r.json();
  } catch (_) { toast('连不上电脑'); return; }
  if (!info.available || !info.versionCode) { toast('电脑上还没有发布新版本'); return; }
  updateInfo = info.versionCode > n.versionCode() ? info : null;
  if ($('p-me').classList.contains('on')) renderMe();
  if (info.versionCode <= n.versionCode()) { toast('已经是最新的 v' + n.versionName()); return; }
  const notes = String(info.notes || '').trim();
  openSheet('<h3>有新版本 ' + esc(info.versionName || info.versionCode) + '</h3>' +
    '<div class="desc">这次改了什么</div>' +
    '<div class="hint" style="margin-top:10px;white-space:pre-wrap;font-size:13px;color:var(--dim)">' +

    $('u-no').addEventListener('click', closeSheet);
    $('u-yes').addEventListener('click', () => {

      n.installUpdate(new URL(info.url, location.href).toString());
    });
  });
}

/* ---------- 启动 ---------- */
// 同一条电脑对话被接管过两次（旧版本会这样）：只留当前选中的那条。
async function cleanupDuplicateSessions() {
  const seen = new Set();
  const dupes = [];
  const list = (state.sessions || []).slice().sort((a, b) => {
    const aa = a.id === state.activeId ? 1 : 0;
    const bb = b.id === state.activeId ? 1 : 0;
    return (bb - aa) || ((b.updatedAt || 0) - (a.updatedAt || 0));
  });
  list.forEach((s) => {
    if (!s.threadId) return;
    if (seen.has(s.threadId)) { dupes.push(s.id); return; }
    seen.add(s.threadId);
  });
  if (!dupes.length) return;
  for (const id of dupes) await apiPost('session/delete', { id }).catch(() => {});
  await refresh();
}

// 读一条对话的历史。失败给 null，调用方自己决定兜底成什么样。
function readThread(tid) {
  return api('threads/read?id=' + encodeURIComponent(tid))
    .then((r) => (r.ok ? r.json() : null))
    .catch(() => null);
}

// 收下服务端给的整份状态。/api/state 和 /api/session/select 回的是一样的东西，
// 两边共用这一段，免得只有 refresh 这条路会更新 runState。
function applyState(st) {
  if (!st) return;
  pushLanUrls(st.lanUrls);
  state = st;
  runState = state.running || null;
  runSig = runSigOf(runState);
}

async function refresh() {
  const r = await api('state');
  applyState(await r.json());
  if (!state.active && state.sessions.length) {
    const r2 = await apiPost('session/select', { id: state.sessions[0].id });
    if (r2.ok) applyState(await r2.json());
  }
}
async function boot() {
  watchKeyboard();
  openLive();
  // 先用缓存把界面铺出来，再去拿最新的
  const last = readLast();
  threads = cachedThreads();
  importedAt = cachedAt();
  renderChats();
  renderImport();
  // 列表页是主屏：启动就把列表铺出来，不再自动钻回上次那条对话
  setChatVisible(false);
  attachPull($('chats-scroll'), $('ptr'), async () => {
    await refresh();
    await Promise.all([loadThreads(true), loadFeed(true)]);
    renderChats();
  });
  $('feed-refresh').addEventListener('click', async () => {
    await loadFeed(true);
    toast('已刷新');
  });
  // 切后台/切网络时这几个请求会被系统掐断（日志里那些 ERR_CONNECTION_ABORTED），
  // 属于正常现象，别让它变成未处理的报错
  try { await refresh(); } catch (_) {}
  try { await cleanupDuplicateSessions(); } catch (_) {}
  renderChats();
  loadThreads(false);
  loadFeed(false);
  syncNtfy();
  // 电脑上正在生成时，列表和对话里都要能看见转圈圈
  // 空闲时 4 秒问一次就够；自己这条对话在跑的时候提到 1 秒，
  // 内容才会像"实时"一样往外冒（照 DusuWorks 那套校准节奏）。
  (function schedulePoll() {
    setTimeout(() => {
      if (!document.hidden) pollStatus();
      schedulePoll();
    }, remoteRunning ? 1000 : 4000);
  })();
  pollStatus();
  // 回到上次那一页；上次开着的对话直接从缓存里画出来，不用等网络
  if (last.tab && last.tab !== 'chats') {
    switchTab(last.tab);
  } else {
    ensureChatOpen();
  }
  setTimeout(renderChats, 300);
  setTimeout(quietCheckUpdate, 1400);
  // 对话列表整份 125 KB：以前每一分钟重拉一遍，现在三分钟一次，
  // 而且只在看着列表页的时候拉；切回前台和下拉刷新都还会各自补一次。
  setInterval(() => {
    if (!document.hidden && !$('chat').classList.contains('on')) loadThreads(true);
  }, 180000);
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // updateViaCache: 'none' 让浏览器每次都去问最新的 sw.js，
    // 否则旧的外壳可能被缓存粘住（外壳缓存见 sw.js）
    navigator.serviceWorker.register('sw.js?k=' + TOKEN, { updateViaCache: 'none' })
      .then((reg) => reg.update().catch(() => {}))
      .catch(() => {});
  });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadThreads(true); pollStatus(); if (outbox.length) flushOutbox(); pollShare(); } });
// 系统层面网络恢复（飞行模式关掉、WiFi 重连）时立刻补发
window.addEventListener('online', () => { if (outbox.length) flushOutbox(); });
boot();
