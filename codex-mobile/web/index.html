<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#101114" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="app.webmanifest?k=__TOKEN__" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Codex 随行</title>
<link rel="icon" href="icon-192.png" />
<style>
  :root {
    --bg: #101114;
    --surface: #17181c;
    --surface-2: #1e2025;
    --surface-3: #24262c;
    --line: #2a2c33;
    --text: #e6e7e9;
    --dim: #9a9ca3;
    --faint: #6b6d75;
    --accent: #69c497;
    --accent-ink: #0c1512;
    --warn: #d9a441;
    --danger: #e8756b;
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --tabh: 60px;
    --pad: 16px;
    /* 底部标签栏占掉的高度。键盘弹起来时置 0：那会儿标签栏收起来给输入框让位。 */
    --tabpad: calc(var(--tabh) + var(--sab, env(safe-area-inset-bottom, 0px)));
  }
  html.kb { --tabpad: 0px; }
  html.kb nav { display: none; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 让它更像手机 App、少点"网页味"：
     - 双击不再放大（按钮上 touch-action: manipulation）
     - 除了消息正文和输入框，别处不允许选中文字（长按不会弹出选择柄和放大镜）
     - 整页禁用双指缩放由 viewport 的 user-scalable=no 负责 */
  button, .row, nav, .chatbar, .drawer, .grouphead { touch-action: manipulation; }
  html, body { overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }
  .bubble, .bubble *, textarea, input, .ap-detail, pre, code {
    -webkit-user-select: text; user-select: text;
  }
  html, body { margin: 0; height: 100%; }
  /* 安卓键盘弹出时，WebView 会试着把输入框滚进视野，整页跟着往上挪，
     顶栏就被顶出屏幕了。把文档本身钉死，能滚的只有内部的 .scroll。 */
  html { position: fixed; inset: 0; overflow: hidden; }
  body {
    position: fixed; inset: 0; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: none; padding: 0; cursor: pointer; }
  .ic { width: 22px; height: 22px; fill: currentColor; flex: 0 0 auto; display: block; }
  .ic.sm { width: 18px; height: 18px; }

  /* ---------- 页面骨架 ---------- */
  .page {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding-bottom: var(--tabpad);
    visibility: hidden; opacity: 0;
  }
  .page.on { visibility: visible; opacity: 1; }
  .appbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    /* --sat 由安卓壳注入（targetSdk 35 强制 edge-to-edge，WebView 不报 safe-area） */
    padding: calc(var(--sat, env(safe-area-inset-top, 0px)) + 12px) 10px 10px var(--pad);
    min-height: 56px;
  }
  .appbar h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .appbar .sp { flex: 1 1 auto; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center; color: var(--dim);
  }
  .iconbtn:active { background: var(--surface-2); color: var(--text); }
  .scroll { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }

  /* 下拉刷新 */
  .ptr {
    height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 12.5px; transition: height .18s;
  }
  .ptr.on { transition: none; }
  .ptr .sp { margin-right: 7px; }
  .ptr.busy .sp { animation: spin 1s linear infinite; }

  /* ---------- 分组列表（Material 惯例，不用铺满卡片） ---------- */
  .group { margin: 0 var(--pad) 18px; }
  .grouphead {
    display: flex; align-items: center; gap: 8px;
    padding: 0 4px 8px; color: var(--dim); font-size: 12.5px;
  }
  .grouphead .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  .sheetbox { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 13px; width: 100%;
    padding: 13px 14px; text-align: left; position: relative;
  }
  .row + .row::before {
    content: ""; position: absolute; left: 49px; right: 0; top: 0;
    border-top: 1px solid var(--line);
  }
  .row:active { background: var(--surface-2); }
  .row.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .row .lead { color: var(--faint); }
  .row.on .lead { color: var(--accent); }
  .row .bd { flex: 1 1 auto; min-width: 0; display: block; }
  .row .t1, .row .t2 { display: block; }
  .row .t1 {
    font-size: 15px; font-weight: 500; letter-spacing: -.005em; line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .t2 {
    font-size: 12.5px; color: var(--dim); margin-top: 4px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .tail { color: var(--faint); font-size: 12px; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .row.danger .t1 { color: var(--danger); }

  /* 正在生成：列表里那一行的小圈，和对话底部的提示条 */
  .run-ic { width: 13px; height: 13px; color: var(--accent); animation: spin 1s linear infinite; }
  .row .tail.run { display: flex; align-items: center; gap: 5px; color: var(--accent); }
  .genbar { display: flex; align-items: center; gap: 8px; padding: 4px 2px 10px; color: var(--dim); font-size: 12.5px; }
  .gen-ic { width: 14px; height: 14px; color: var(--accent); animation: spin 1s linear infinite; }
  /* "正在进行"那条：秒表 + 当前在做什么 + 从左往右扫的高亮 */
  .genbar { flex-direction: column; align-items: stretch; gap: 6px; }
  .genbar .gline { display: flex; align-items: center; gap: 8px; }
  .genbar .gline .gt { color: var(--text); font-variant-numeric: tabular-nums; }
  .genbar .gact {
    color: var(--faint); font-size: 12px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding-left: 22px;
  }
  .sweep { position: relative; height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .sweep i {
    position: absolute; top: 0; bottom: 0; left: 0; width: 38%; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    /* 走 transform：以前动的是 left，浏览器每一帧都要重新排版一遍，
       而这条扫光正好只在"正在生成"时出现，也就是你盯着屏幕看的时候。 */
    animation: sweep 1.25s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes sweep { 0% { transform: translateX(-105%); } 100% { transform: translateX(265%); } }
  /* 顶栏上那个小点：滚到上面去了也知道还在跑 */
  .rundot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    display: none; margin-right: 2px; animation: pulse 1.4s ease-in-out infinite;
  }
  .rundot.on { display: block; }

  /* 导入进度：第一次从电脑同步对话时显示 */
  .imp { margin: 0 var(--pad) 14px; }
  .imp .bar { height: 3px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
  .imp .bar i { display: block; height: 100%; width: 34%; border-radius: 2px; background: var(--accent); animation: slide 1.15s ease-in-out infinite; }
  .imp .txt { margin-top: 9px; font-size: 12.5px; color: var(--dim); display: flex; align-items: center; gap: 7px; }
  .imp .txt .ic { animation: spin 1s linear infinite; }
  .imp.done .bar { display: none; }
  .imp.done .txt .ic { animation: none; color: var(--faint); }
  @keyframes slide { 0% { transform: translateX(-105%); } 100% { transform: translateX(310%); } }

  /* 我的：顶部那张卡，字号比列表行大一档 */
  .hero { margin: 0 var(--pad) 18px; padding: 18px 16px; border-radius: var(--r-lg); background: var(--surface); }
  .hero .name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .hero .ver { margin-top: 7px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .hero .up { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; color: var(--accent); font-size: 14px; font-weight: 500; }
  .hero .up .sp { flex: 1 1 auto; }
  .hero .up.none { color: var(--dim); font-weight: 400; }

  /* 开关 */
  .sw { width: 46px; height: 28px; border-radius: 999px; background: var(--surface-3); position: relative; transition: background .18s; flex: 0 0 auto; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #767a83; transition: transform .18s, background .18s; }
  .sw.on { background: color-mix(in srgb, var(--accent) 36%, transparent); }
  .sw.on i { transform: translateX(18px); background: var(--accent); }

  /* 第三方推送渠道：一张能看懂的清单，而不是一个下拉框 */
  .chans { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 4px; }
  .chan { display: flex; align-items: center; gap: 13px; width: 100%; padding: 13px 14px; text-align: left; position: relative; }
  .chan + .chan::before { content: ""; position: absolute; left: 49px; right: 0; top: 0; border-top: 1px solid var(--line); }
  .chan:active { background: var(--surface-2); }
  .chan .lead { color: var(--faint); }
  .chan.on .lead { color: var(--accent); }
  .chan .bd { flex: 1 1 auto; min-width: 0; display: block; }
  .chan .t1, .chan .t2 { display: block; }
  .chan .t1 { font-size: 15px; font-weight: 500; line-height: 1.35; }
  .chan .t2 { font-size: 12.5px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
  .chan .tick { color: var(--accent); opacity: 0; flex: 0 0 auto; }
  .chan.on .tick { opacity: 1; }
  .hint { font-size: 12px; color: var(--faint); margin: 7px 2px 0; line-height: 1.55; }

  /* 选项列表：替代系统自带的 select 下拉（那个在黑色界面上很出戏），
     点一下直接选中，不用再弹一层系统菜单 */
  .opts { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
  .opt {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 12px 13px; text-align: left; position: relative;
  }
  .opt + .opt::before {
    content: ""; position: absolute; left: 13px; right: 0; top: 0;
    border-top: 1px solid var(--line);
  }
  .opt:active { background: var(--surface-3); }
  .opt .bd { flex: 1 1 auto; min-width: 0; display: block; }
  .opt .t1 { display: block; font-size: 14.5px; font-weight: 500; line-height: 1.35; }
  .opt .t2 { display: block; font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.4; }
  .opt .tick { color: var(--accent); opacity: 0; flex: 0 0 auto; }
  .opt.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .opt.on .t1 { color: var(--accent); font-weight: 600; }
  .opt.on .tick { opacity: 1; }

  /* ---------- 服务磁贴 ---------- */
  /* 两列都要能缩：minmax(0,1fr) 而不是 1fr。1fr 的最小宽度是内容宽度，
     而副标题是一行不换行的（要省略号），内容一长就把这一列撑宽、把另一列
     挤出屏幕外——手机上就是"只看见一半"。 */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0 var(--pad) 18px; }
  .tile {
    background: var(--surface); border-radius: var(--r-lg); padding: 15px 14px 13px;
    display: flex; flex-direction: column; gap: 10px; min-height: 116px; text-align: left;
    min-width: 0;
  }
  .tile:active { background: var(--surface-2); transform: scale(.985); }
  .tile .ti { color: var(--accent); }
  .tile .tn { font-size: 14px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .td {
    font-size: 11.5px; color: var(--faint); margin-top: auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile.add { align-items: center; justify-content: center; color: var(--dim); border: 1px dashed var(--line); background: none; }
  .tile.add:active { background: var(--surface); }

  /* ---------- 电脑状态（从「服务」里点开） ---------- */
  #sysmon {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: flex; flex-direction: column;
    padding-bottom: calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 10px);
    transform: translateX(100%); visibility: hidden;
    transition: transform .24s cubic-bezier(.32,.72,0,1);
  }
  #sysmon.on { transform: none; visibility: visible; }
  #sysmon .chatbar .tt .p { direction: ltr; }

  /* ---------- 电脑状态 ---------- */
  .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  .mcell .ml { font-size: 12px; color: var(--dim); }
  .mcell .mn {
    margin: 3px 0 6px; font-size: 21px; font-weight: 600; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .mcell .mn.warn { color: var(--warn); }
  .mcell .ms { margin-top: 5px; }
  .mon-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 var(--pad) 12px; }
  .mcard {
    background: var(--surface); border-radius: var(--r-lg);
    padding: 14px 15px 13px; margin-bottom: 12px;
  }
  /* 点标题栏收起这一张卡，收起的偏好记在本地 */
  .mh { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .mh .foldic { color: var(--faint); transform: rotate(90deg); transition: transform .18s; align-self: center; }
  .mcard.fold .mh .foldic { transform: none; }
  .mcard.fold .mbody { display: none; }
  .mh .mt { flex: 1 1 auto; font-size: 13px; color: var(--dim); }
  .mh .mv {
    font-size: 23px; font-weight: 600; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .mh .mv.warn { color: var(--warn); }
  .mh .mu { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ms { margin-top: 9px; font-size: 12px; color: var(--faint); }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 9px; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .bar i.warn { background: var(--warn); }
  /* Chart.js 要一个定高的容器 */
  .chartbox { position: relative; height: 64px; margin-top: 10px; }
  /* 每核占用：一根根小柱，核多核少都能自适应 */
  .cores { display: flex; gap: 2px; height: 26px; margin-top: 10px; }
  .cores i { flex: 1 1 0; min-width: 1px; border-radius: 2px; background: var(--surface-3); position: relative; }
  .cores i b { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
  .cores i b.warn { background: var(--warn); }
  .kv { display: flex; align-items: baseline; gap: 8px; font-size: 13px; margin-top: 10px; }
  .kv .kn { flex: 1 1 auto; font-weight: 500; }
  .kv .kv2 { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .draw { display: flex; align-items: baseline; gap: 8px; font-size: 13px; margin-top: 12px; }
  .draw .dn { flex: 1 1 auto; font-weight: 500; }
  .draw .dv { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mproc { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13.5px; }
  .mproc + .mproc { border-top: 1px solid var(--line); }
  .mproc .pn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mproc .pc { flex: 0 0 auto; color: var(--faint); font-size: 12px; }
  .mproc .pm { flex: 0 0 auto; color: var(--dim); font-variant-numeric: tabular-nums; }

  /* ---------- 底部标签栏 ---------- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    height: calc(var(--tabh) + var(--sab, env(safe-area-inset-bottom, 0px)));
    padding-bottom: var(--sab, env(safe-area-inset-bottom, 0px));
    /* 不透明纯色，别用 backdrop-filter：底部这条是 fixed 的，安卓 WebView 上
       那块毛玻璃会让"内容从它后面滚过去"的每一帧都变贵，是滚动卡顿的常见来源。 */
    display: flex; background: var(--bg);
    border-top: 1px solid var(--line);
  }
  nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 11px; color: var(--faint); transition: color .15s;
  }
  nav button.on { color: var(--accent); }
  nav button:active { opacity: .6; }

  /* ---------- 对话：当前这条占主屏，其余对话收在左上角的抽屉里 ---------- */
  #p-chats { bottom: var(--kb, 0px); }
  #chat { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; }
  #chat.on { display: flex; }
  /* 一条对话都没有：抽屉里也没得挑，主屏给个空状态 */
  #chat-none {
    flex: 1 1 auto; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 0 30px 70px; text-align: center;
  }
  #chat-none.off { display: none; }
  #chat-none .ic { width: 30px; height: 30px; color: var(--line); margin-bottom: 12px; }
  #chat-none .e1 { font-size: 14px; color: var(--dim); }
  #chat-none .e2 { font-size: 12.5px; color: var(--faint); margin-top: 5px; }
  #chat-none .go {
    margin-top: 18px; padding: 11px 24px; border-radius: var(--r-md);
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }
  /* 没打开任何一条对话时，右上角那个「···」没有对象可改 */
  #chat-menu.off { display: none; }
  /* 底部留白由页面统一让给标签栏，输入框这里不再叠一层安全区 */
  #chat .composer { padding-bottom: 10px; }
  /* 全部对话：从左边滑出来的抽屉，盖住标签栏 */
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 46;
    width: min(86vw, 380px); display: flex; flex-direction: column;
    background: var(--surface); box-shadow: 0 0 46px rgba(0,0,0,.5);
    padding: calc(var(--sat, env(safe-area-inset-top, 0px)) + 12px) 0
             calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 8px);
    transform: translateX(-103%); visibility: hidden;
    transition: transform .26s cubic-bezier(.32,.72,0,1);
  }
  .drawer.on { transform: none; visibility: visible; }
  .drawer .dhead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 8px 10px var(--pad); }
  .drawer .dhead .dt { flex: 1 1 auto; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .dmask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 45;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .dmask.on { opacity: 1; pointer-events: auto; }
  .chatbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 4px;
    padding: calc(var(--sat, env(safe-area-inset-top, 0px)) + 8px) 8px 8px 6px;
    background: var(--bg); position: relative; z-index: 2;
  }
  .chatbar .tt { flex: 1 1 auto; min-width: 0; padding: 0 2px; }
  .chatbar .tt .t { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chatbar .tt .p { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  /* 连不上电脑时的一条提示。以前断了是静默的：页面照旧显示，
     发出去的消息卡着不动，人只会以为"同步坏了"。 */
  .offbar { display: none; padding: 6px 12px; font-size: 12px; color: #e8b48a;
            background: #2a2320; border-bottom: 1px solid #3a2f28; }
  .offbar.on { display: flex; align-items: center; gap: 6px; }
  .offbar .ic { width: 14px; height: 14px; flex: 0 0 auto; }
  /* 全部对话里的搜索框 */
  .searchwrap { display: flex; align-items: center; gap: 8px; margin: 2px 12px 10px;
                padding: 8px 12px; border-radius: 12px; background: var(--card, #1b1d1f); }
  .searchwrap .ic { width: 16px; height: 16px; color: var(--faint); flex: 0 0 auto; }
  .searchwrap input { flex: 1 1 auto; min-width: 0; background: none; border: 0; outline: 0;
                      color: inherit; font-size: 14px; }
  .grouphead .cv { width: 14px; height: 14px; margin-right: 4px; transition: transform .15s; }
  .grouphead.fold .cv { transform: rotate(0deg); }
  .grouphead.open .cv { transform: rotate(90deg); }
  /* "用时 2 分 13 秒" 这类小注脚 */
  .elapsed { text-align: center; font-size: 11px; color: var(--faint); margin: 6px 0 2px; }
  /* 任务耗时小胶囊（居中、可关闭） */
  .elapsedchip { display: flex; align-items: center; justify-content: center; gap: 6px;
                 font-size: 12px; color: var(--faint); margin: 8px 0 2px; }
  .elapsedchip .x { background: none; border: 0; color: inherit; font-size: 14px; line-height: 1; padding: 0 2px; }
  /* 错误卡片：和正常回复明显分开 */
  .errcard { border-radius: 14px; padding: 12px 14px; background: rgba(232,117,107,.12);
             border: 1px solid rgba(232,117,107,.35); }
  .errcard .etitle { display: flex; align-items: center; gap: 6px; font-weight: 600;
                     color: #e8756b; margin-bottom: 6px; font-size: 13px; }
  .errcard .ebody { font-size: 12.5px; line-height: 1.5; color: var(--text, #e7e9ea);
                    white-space: pre-wrap; word-break: break-word; }
  /* 选择题卡片 */
  .qbox { margin: 8px 0 2px; }
  .qhead { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .qtext { font-size: 13px; color: var(--faint); margin-bottom: 6px; white-space: pre-wrap; }
  .qopts { display: flex; flex-wrap: wrap; gap: 6px; }
  .ap-btn.chosen { background: var(--accent, #69c497); color: #10211a; }
  /* 待发送的附件：横排小图，点 ✕ 去掉 */
  .attbar { display: none; gap: 8px; padding: 8px 12px 0; flex-wrap: wrap; }
  .attbar.on { display: flex; }
  .att { position: relative; width: 56px; height: 56px; border-radius: 10px; overflow: hidden;
         background: var(--card, #1b1d1f); display: flex; align-items: center; justify-content: center; }
  .att img { width: 100%; height: 100%; object-fit: cover; }
  .att .nm { font-size: 9px; padding: 3px; color: var(--faint); text-align: center; line-height: 1.2;
             word-break: break-all; max-height: 100%; overflow: hidden; }
  .att .rm { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
             background: rgba(0,0,0,.62); color: #fff; font-size: 12px; line-height: 18px; text-align: center; }
  .att.up { opacity: .55; }
  /* 上一轮被打断时出现的"继续"条（和桌面版同一个形态） */
  .contbar { display: none; padding: 0 12px 6px; }
  .contbar.on { display: block; }
  .contbar button { width: 100%; padding: 9px 12px; border-radius: 10px; font-size: 13px;
                    color: var(--accent, #69c497); background: rgba(105,196,151,.12);
                    border: 1px solid rgba(105,196,151,.35); }
  /* 文件改动卡片：和桌面端一样"几个文件、增删多少行"；点开每个文件能看 diff */
  .fcbox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 2px 0 2px; padding: 12px 14px;
           border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .fcbox .lead { flex: 0 0 auto; color: var(--accent, #69c497); }
  .fcbox .bd { flex: 1 1 auto; min-width: 0; }
  .fcbox .t1 { font-size: 14px; font-weight: 600; }
  .fcbox .t2 { font-size: 12px; margin-top: 2px; }
  .fcbox .plus { color: #69c497; }
  .fcbox .minus { color: #e8756b; margin-left: 6px; }
  .fcbox .fcfiles { flex: 1 1 100%; margin-top: 6px; border-top: 1px solid var(--line); }
  .fcfile .fn { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
                width: 100%; padding: 8px 0 4px; font-size: 12.5px; text-align: left; }
  .fcfile .fn .p { color: var(--text); word-break: break-all; }
  .fcfile .fn .s { flex: none; font-size: 11px; color: var(--faint); }
  .fcfile pre { display: none; margin: 2px 0 8px; padding: 8px 10px; background: var(--bg);
                border-radius: 8px; font-size: 11px; line-height: 1.5; overflow-x: auto;
                white-space: pre; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .fcfile.open pre { display: block; }
  .fcfile .dadd { color: #69c497; }
  .fcfile .ddel { color: #e8756b; }
  .fcfile .dmeta { color: var(--faint); }
  /* 消息里的图片：点一下全屏看 */
  .bubble img.mdimg { max-width: 100%; border-radius: 10px; display: block; margin: 6px 0; }
  /* 图片预览：毛玻璃底 + 左右滑切图 + 双指缩放。
     底不再用纯黑，用带模糊的半透明 —— 后面的对话内容透一点出来，
     看得出"这是浮在对话之上"而不是切走了。 */
  .imgview { position: fixed; inset: 0; z-index: 400;
             display: none; align-items: center; justify-content: center;
             background: rgba(10,11,14,.7);
             backdrop-filter: blur(24px) saturate(1.3);
             -webkit-backdrop-filter: blur(24px) saturate(1.3);
             touch-action: none; }
  .imgview.on { display: flex; }
  .imgstage { position: absolute; inset: 0; display: flex;
              align-items: center; justify-content: center; overflow: hidden; }
  .imgstage img { max-width: 96vw; max-height: 82vh; object-fit: contain;
              transition: transform .16s ease-out; will-change: transform; }
  .imgstage img.snap { transition: none; }
  /* 左上角关闭键：返回键也能退，但有个显式按钮更顺手 */
  .imgx { position: absolute; left: 14px; top: calc(var(--sat, env(safe-area-inset-top, 0px)) + 14px);
          width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16);
          background: rgba(255,255,255,.12); color: #e6e7e9; font-size: 19px; line-height: 1;
          display: flex; align-items: center; justify-content: center; z-index: 2; }
  /* 第几张 / 共几张 */
  .imgcount { position: absolute; top: calc(var(--sat, env(safe-area-inset-top, 0px)) + 26px);
          left: 0; right: 0; text-align: center; color: rgba(230,231,233,.72);
          font-size: 12px; pointer-events: none; }
  /* 大图下面那排按钮：看细节用的「查看原图」和存到手机的「下载」 */
  .imgbar { position: absolute; left: 0; right: 0;
            bottom: calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 22px);
            display: flex; gap: 10px; justify-content: center; }
  .imgbar button { padding: 10px 18px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1);
            color: #e6e7e9; font-size: 13px; }
  .imgbar button:disabled { opacity: .45; }
  /* 语音输入：识别中话筒变强调色 */
  #btn-voice.on { color: var(--accent, #69c497); background: rgba(105,196,151,.14); }
  /* 助手消息下面的操作行 + "内容由AI生成" */
  .actrow { display: flex; align-items: center; gap: 14px; padding: 2px 2px 0; color: var(--faint); }
  .actrow button { background: none; border: 0; padding: 2px; color: inherit; }
  .actrow .ic { width: 16px; height: 16px; }
  .ailabel { font-size: 11px; color: var(--faint); padding: 2px 2px 8px; }
  /* 全部对话：标题＋视图切换、圆形图标行、右下角悬浮新建 */
  .dhead .dt { background: none; border: 0; color: inherit; font-size: 19px; font-weight: 700;
               display: flex; align-items: center; gap: 4px; padding: 0; }
  .dhead .dt .cv { width: 14px; height: 14px; color: var(--faint); }
  .row .lead.round { width: 34px; height: 34px; border-radius: 50%; background: var(--surface);
                     display: flex; align-items: center; justify-content: center; margin-right: 10px; }
  .row .lead.round .ic { width: 17px; height: 17px; }
  .row .t2 { font-size: 12px; color: var(--faint); margin-top: 2px; }
  .fab { position: absolute; right: 16px; bottom: calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 18px);
         width: 52px; height: 52px; border-radius: 50%; border: 0; z-index: 3;
         background: var(--accent); color: var(--accent-ink);
         display: flex; align-items: center; justify-content: center;
         box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .fab .ic { width: 22px; height: 22px; }
  #log { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 14px 10px; }
  /* "正在生成"提示条的家：钉在输入框上方，不进消息列表 */
  #genhost { flex: 0 0 auto; padding: 0 14px; }
  #genhost:empty { display: none; }
  .mrow { display: flex; margin-bottom: 14px; }
  .mrow.me { justify-content: flex-end; }
  .bubble {
    max-width: 86%; padding: 10px 13px; border-radius: var(--r-md);
    background: var(--surface); border: 1px solid var(--line);
    word-break: break-word; overflow-wrap: anywhere; font-size: 14.5px;
  }
  .mrow.me .bubble { background: var(--surface-3); border-color: transparent; white-space: pre-wrap; }
  .mrow.ai .bubble { border-bottom-left-radius: 6px; }
  .mrow.me .bubble { border-bottom-right-radius: 6px; }

  /* ---------- 助手回复不做气泡 ----------
     照 Codex 桌面版那样整幅排版：没有底色、没有边框、占满宽度。
     气泡那种东西是给"我说的一句话"用的，长回答套在气泡里读着累。
     只改外观、不改结构：里面的 markdown / 代码块 / 表格样式全部照旧生效。 */
  .mrow.ai { display: block; margin-bottom: 18px; }
  .mrow.ai .bubble {
    max-width: 100%; padding: 0; border: 0; background: none; border-radius: 0;
    font-size: 15px; line-height: 1.62;
  }

  /* ---------- 对话列表：照副屏那套（状态点 + 标题 + 状态 + 当前动作） ---------- */
  #chats-list { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  /* 进了对话就占满整屏：列表收起来、底部标签栏收起、输入框贴到屏幕底 */
  #p-chats.chat-open #chats-list { display: none; }
  #p-chats:not(.chat-open) .chatbar,
  #p-chats:not(.chat-open) #chat,
  #p-chats:not(.chat-open) #chat-none { display: none !important; }
  body.inchat nav { display: none; }
  body.inchat #p-chats { padding-bottom: 0; }

  /* 顶上要给状态栏让位：--sat 是安卓壳量出来注入的（WebView 不报 safe-area-inset-top）。
     这里原来没吃 --sat，"全部对话"就跟手机状态栏叠在一起了。 */
  .listbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: calc(var(--sat, env(safe-area-inset-top, 0px)) + 10px) var(--pad) 4px;
  }
  .listbar .lt {
    display: flex; align-items: center; gap: 3px;
    font-size: 19px; font-weight: 650; letter-spacing: -.01em; color: var(--text);
  }
  .listbar .lt .ic { width: 15px; height: 15px; color: var(--faint); }
  .chips { flex: 0 0 auto; display: flex; gap: 7px; flex-wrap: wrap; padding: 4px var(--pad) 8px; }
  .chip { padding: 3px 10px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line); color: var(--faint); }
  .chip.run { color: #7ee787; border-color: rgba(126,231,135,.45); }
  .chip.stall { color: #f0b72f; border-color: rgba(240,183,47,.45); }
  .chip.done { color: #79c0ff; border-color: rgba(121,192,255,.45); }

  .clist { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
  .citem {
    display: flex; gap: 10px; width: 100%; text-align: left;
    padding: 11px 13px; border-bottom: 1px solid var(--line);
  }
  .citem:last-child { border-bottom: none; }
  .citem.on { background: rgba(105, 196, 151, .07); }
  .cdot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-top: 6px; }
  .citem.run .cdot { background: #7ee787; box-shadow: 0 0 6px #7ee787; animation: pulse 1.6s ease-in-out infinite; }
  .citem.stall .cdot { background: #f0b72f; }
  .citem.bad .cdot { background: #f85149; }
  .citem.stop .cdot { background: #a371f7; }
  .citem.done .cdot { background: #58a6ff; }
  .cbody { display: block; flex: 1 1 auto; min-width: 0; }
  .crow { display: flex; align-items: baseline; gap: 8px; }
  .ctitle {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 14.5px; color: var(--text);
  }
  .cstat { flex: 0 0 auto; font-size: 11.5px; color: var(--faint); }
  .citem.run .cstat { color: #7ee787; }
  .citem.stall .cstat { color: #f0b72f; }
  .citem.bad .cstat { color: #f85149; }
  .citem.stop .cstat { color: #a371f7; }
  .citem.done .cstat { color: #79c0ff; }
  .cmeta {
    display: block; margin-top: 2px; font-size: 11.5px; color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cact {
    display: block; margin-top: 2px; font-size: 11.5px; color: var(--dim);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 离线发件箱：没发出去的消息是虚线气泡，底下一行小字告诉你它在等什么 */
  .bubble.pending { opacity: .78; border: 1px dashed var(--faint); background: transparent; }
  .bubble.pending .qtag {
    margin-top: 7px; padding-top: 6px; border-top: 1px dashed var(--line);
    font-size: 11px; line-height: 1.4; color: var(--faint); white-space: normal;
    display: flex; align-items: center; gap: 5px;
  }
  .bubble.pending .qtag .spin { width: 11px; height: 11px; flex: none; }
  .bubble h2, .bubble h3 { margin: 10px 0 6px; font-size: 15px; letter-spacing: -.01em; }
  .bubble code { background: #0b0c0f; border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; font-size: 12.5px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .bubble pre { position: relative; background: #0b0c0f; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 10px 10px; overflow-x: auto; margin: 8px 0; }
  .bubble pre code { background: none; border: none; padding: 0; font-size: 12px; line-height: 1.5; white-space: pre; }
  /* 表格：手机上再宽的表也不横着撑破气泡。外面套一层横向滑动的壳，
     第一列钉在左边不动，滑后面的数字列时始终知道自己在看哪一行。 */
  .bubble .tw { margin: 9px 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line); border-radius: var(--r-sm); background: #0b0c0f; }
  .bubble .tw table { border-collapse: collapse; font-size: 12.5px; line-height: 1.45;
    width: max-content; min-width: 100%; }
  .bubble .tw th, .bubble .tw td { padding: 7px 10px; text-align: left; vertical-align: top;
    white-space: nowrap; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .bubble .tw th { background: var(--surface-2); color: var(--dim); font-weight: 600; }
  .bubble .tw tr:last-child td { border-bottom: none; }
  .bubble .tw th:last-child, .bubble .tw td:last-child { border-right: none; }
  .bubble .tw th:first-child, .bubble .tw td:first-child { position: sticky; left: 0; z-index: 1;
    background: #0b0c0f; white-space: normal; max-width: 42vw; }
  .bubble .tw th:first-child { background: var(--surface-2); z-index: 2; }
  .bubble .tw .ta-c { text-align: center; }
  .bubble .tw .ta-r { text-align: right; }
  /* 有表格的那条消息放宽到整行，别让表格挤在 86% 里（老 WebView 不支持 :has 就跳过） */
  .mrow.ai .bubble:has(.tw) { max-width: 100%; }
  .copybtn { position: absolute; top: 6px; right: 6px; font-size: 11px; padding: 3px 9px; background: var(--surface-2); color: var(--dim); border-radius: 999px; }
  .acts { margin: -8px 0 12px 2px; }
  .act { font-size: 12px; color: var(--faint); padding: 1px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .caret::after { content: "▍"; animation: blink 1s steps(2, start) infinite; color: var(--accent); }
  @keyframes blink { to { visibility: hidden; } }
  .composer {
    flex: 0 0 auto; display: block;
    padding: 8px 12px calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 10px);
    border-top: 1px solid var(--line);
    background: var(--bg); position: relative; z-index: 2;
  }
  /* 三个按钮 + 输入框合到同一个框里：外框从原来只圈文字，扩成把
     附件、语音、发送一起框进来。按钮自己的位置、大小、间距都没动，
     只是换了外面那层底色和描边。 */
  .composer .cbox {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 4px;
    border: 1px solid var(--line); border-radius: 22px;
    background: var(--surface);
  }
  .composer .cbox:focus-within { border-color: var(--accent); }
  .composer textarea {
    flex: 1; min-width: 0; resize: none; max-height: 132px; min-height: 42px; padding: 10px 6px;
    border: 0; background: transparent; outline: none;
  }
  .send {
    /* 圆形发送键（跟常见手机端聊天一致）：空闲是向上箭头，跑着时变成停止方块 */
    flex: 0 0 auto; width: 44px; height: 44px; padding: 0; border: 0;
    border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
  }
  .send .ic { width: 20px; height: 20px; }
  .send.stop { background: #e8756b; color: #2a1512; }
  }
  .send:disabled { opacity: .45; }
  .send.stop { background: var(--danger); color: #1a0d0b; }

  /* 审批卡片 */
  .bubble.approval { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); max-width: 100%; width: 100%; }
  .ap-title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; margin-bottom: 9px; color: var(--warn); }
  .ap-detail { margin: 0 0 9px; padding: 9px 10px; border-radius: var(--r-sm); background: #0b0c0f; border: 1px solid var(--line); font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 30dvh; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .ap-reason { font-size: 12.5px; color: var(--dim); margin-bottom: 12px; }
  .ap-bar { display: flex; gap: 7px; flex-wrap: wrap; }
  .ap-btn { flex: 1 1 auto; min-width: 84px; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
  .ap-btn.ok { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .ap-btn.no { color: var(--danger); }
  .ap-btn:disabled { opacity: .4; }
  .ap-btn.chosen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ap-note { margin-top: 9px; font-size: 12px; color: var(--faint); }

  /* ---------- 弹层 / 轻提示 ---------- */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 50; }
  .mask.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 51;
    background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 10px var(--pad) calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 18px);
    transform: translateY(103%); transition: transform .24s cubic-bezier(.32,.72,0,1);
    max-height: 88dvh; overflow-y: auto;
  }
  .sheet.on { transform: none; }
  .sheet .grab { width: 34px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .sheet .desc { color: var(--dim); font-size: 13px; margin-bottom: 4px; }
  .sheet .desc a.lnk { color: var(--accent); text-decoration: none; word-break: break-all; }
  .sheet label { display: block; font-size: 12.5px; color: var(--dim); margin: 14px 0 6px; }
  .sheet input, .sheet select, .sheet textarea {
    width: 100%; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--line);
    background: var(--surface-2); outline: none;
  }
  .sheet input:focus, .sheet select:focus { border-color: var(--accent); }
  .sheet .actions { display: flex; gap: 9px; margin-top: 20px; }
  .sheet .actions button { flex: 1; padding: 13px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); }
  .sheet .actions .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .sheet .actions .no { color: var(--danger); }

  #toast {
    position: fixed; left: 50%; bottom: calc(var(--tabh) + var(--sab, env(safe-area-inset-bottom, 0px)) + 20px);
    transform: translate(-50%, 10px); z-index: 60;
    background: var(--surface-3); color: var(--text);
    padding: 11px 18px; border-radius: var(--r-md); font-size: 13.5px; max-width: 86vw;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* 状态 */
  .skeleton { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
  .sk-row { display: flex; align-items: center; gap: 13px; padding: 14px; }
  .sk-row + .sk-row { border-top: 1px solid var(--line); }
  .sk { background: var(--surface-2); border-radius: 6px; height: 12px; }
  .sk.round { width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto; }
  .sk.line1 { width: 56%; }
  .sk.line2 { width: 34%; height: 10px; margin-top: 7px; }
  @keyframes pulse { 50% { opacity: .45; } }
  .sk, .sk.round { animation: pulse 1.4s ease-in-out infinite; }
  .empty { text-align: center; padding: 40px 24px; color: var(--faint); }
  .empty .ic { margin: 0 auto 12px; color: var(--line); width: 30px; height: 30px; }
  .empty .e1 { font-size: 14px; color: var(--dim); }
  .empty .e2 { font-size: 12.5px; margin-top: 5px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<!-- 图表库：Chart.js v4.5.1（MIT），跟电脑端一起发出去，不走外网 CDN -->
<script src="chart.umd.min.js?k=__TOKEN__&v=4.5.1"></script>
<script>
const TOKEN = "__TOKEN__";
// 这一份外壳是电脑上哪个版本发出来的。和 /api/status 的 build 对不上就说明
// Service Worker 还端着旧外壳，得主动让它去换（见 forceShellRefresh）。
const SHELL_BUILD = "__BUILD__";
// 注意：p 里可能已经有查询参数（例如 threads/read?id=xxx），
// 这时候要用 & 拼口令，不能直接再补一个 ?，否则整个参数都会串味，服务端直接 403。
const api = (p, o) => fetch('/api/' + p + (p.indexOf('?') >= 0 ? '&' : '?') + 'k=' + TOKEN,
  Object.assign({ cache: 'no-store' }, o || {}));
const apiPost = (p, b) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 通知正文里的链接要能直接点开：日报那种清单里全是论文地址，
// 手机上复制粘贴太难受，点一下就进 App 内置浏览器。
const linkify = (s) => String(s == null ? '' : s)
  .split(/(https?:\/\/[^\s<>"'）】］》〉、，。；：！？…“”]+)/)
  .map((p, i) => i % 2
    ? '<a class="lnk" data-url="' + esc(p) + '">' + esc(p) + '</a>'
    : esc(p))
  .join('');
const ico = (n, cls) => '<svg class="ic ' + (cls || '') + '"><use href="#i-' + n + '"/></svg>';
const native = () => (window.CodexApp && window.CodexApp.info) ? window.CodexApp : null;

// 把电脑当前的局域网入口交给原生存一份。
// 手机和电脑在同一个 WiFi 下时，App 下次启动就能直连局域网、不绕公网隧道；
// 而地址是路由器 DHCP 发的会变，所以每次刷新都交一次（原生那边自己会比对去重）。
function pushLanUrls(list) {
  try {
    const n = native();
    if (n && n.setLanUrls) n.setLanUrls(JSON.stringify(list || []));
  } catch (_) {}
}

// 关键动作（发送、拍板）给一点触感反馈；在纯浏览器里没有这个桥，安静跳过。
function buzz(ms) {
  try { const n = native(); if (n && n.haptic) n.haptic(ms || 15); } catch (_) {}
}

// 人不在看（切后台/锁屏）时让原生补一条系统通知。
// 审批和选择题都有超时，错过就按拒绝/放弃处理，所以这条不能省。
function notifyHidden(title, body) {
  const n = native();
  if (n && n.notify) { try { n.notify(title, body); } catch (_) {} }
}

// 网页里的报错也送进手机端日志：在手机上出问题时，日志和截图一起传回电脑
window.addEventListener('error', (e) => {
  const n = native();
  if (n && n.log) n.log('js-err', (e.message || '错误') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
});
window.addEventListener('unhandledrejection', (e) => {
  const n = native();
  const r = e && e.reason;
  if (n && n.log) n.log('js-err', '未处理的失败：' + ((r && r.message) ? r.message : String(r)));
});

// 外壳有新版时（sw.js 发现 index.html 变了会告诉我们）自动换一次，
// 但绝不打断正在打字或者开着弹层的时候。每个会话只换一次。
if ('serviceWorker' in navigator) {
  // 新的外壳服务上线并接管时，换一次，让界面立刻是最新的
  // （第一次安装时会触发一次 claim，那种不算，别刷新）
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) { hadController = true; return; }
    if (sessionStorage.getItem('shellReloaded') === '1') return;
    if ($('sheet').classList.contains('on')) return;
    sessionStorage.setItem('shellReloaded', '1');
    location.reload();
  });
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'shell-updated') return;
    if (sessionStorage.getItem('shellReloaded') === '1') return;
    if ($('sheet').classList.contains('on')) return;
    if ($('input') && $('input').value.trim()) return;
    sessionStorage.setItem('shellReloaded', '1');
    location.reload();
  });
}

let state = { sessions: [], services: [], active: null };
let threads = [];          // 电脑上的对话（本地缓存 + 后台刷新）
let openId = null;
let running = false, stopped = false;
// 哪些对话正在发送。以前只有一个全局的 running，一条对话在跑就把整个
// 发送按钮锁住，于是"在另一条对话里发消息"会被自己挡住（服务端其实放行了）。
const runningIds = new Set();
function refreshRunning() { setRunning(!!(state.activeId && runningIds.has(state.activeId))); }
// 电脑上正在跑的那一轮（{sessionId, threadId, startedAt}）。手机离开界面也照样跑，
// 列表和对话详情靠它在对应那条上转圈圈。
let runState = null;
let runSig = '';

/* ---------- 本地缓存：进页面立刻有内容，不空等 ---------- */
const CACHE_KEY = 'codex.threads.v2';
function readCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !Array.isArray(o.list)) return null;
    return o;
  } catch (_) { return null; }
}
function writeCache(list) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), list })); } catch (_) {}
}
function cachedThreads() {
  const o = readCache();
  return o ? o.list : [];
}
function cachedAt() {
  const o = readCache();
  return o ? o.at : 0;
}

/* 每条对话的内容也存一份在手机上，点进去先看到旧的，再刷新。
   电脑上对话很长时不至于每次打开都空等一次网络往返。 */
const MSG_PREFIX = 'codex.msgs.';
function readMsgs(key) {
  try {
    const raw = localStorage.getItem(MSG_PREFIX + key);
    if (!raw) return null;
    const o = JSON.parse(raw);
    return o && Array.isArray(o.list) ? o.list : null;
  } catch (_) { return null; }
}
function writeMsgs(key, list) {
  try {
    // 只留最后 120 条，别把 localStorage 撑爆
    localStorage.setItem(MSG_PREFIX + key, JSON.stringify({ at: Date.now(), list: list.slice(-120) }));
  } catch (_) {}
}

/* 上次停在哪一页、哪条对话 */
const LAST_KEY = 'codex.last.v1';
function readLast() {
  try { return JSON.parse(localStorage.getItem(LAST_KEY) || 'null') || {}; } catch (_) { return {}; }
}
function writeLast(patch) {
  try { localStorage.setItem(LAST_KEY, JSON.stringify(Object.assign(readLast(), patch))); } catch (_) {}
}

/* ---------- 通用 UI ---------- */
let toastTimer = null;
function toast(msg, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 2200);
}
function openSheet(html, mount) {
  const s = $('sheet');
  s.innerHTML = '<div class="grab"></div>' + html;
  s.classList.add('on');
  $('mask').classList.add('on');
  if (mount) mount(s);
}
function closeSheet() {
  $('sheet').classList.remove('on');
  $('mask').classList.remove('on');
}

/* ---------- 正在生成的提示 ---------- */
function runMatches(run, x) {
  if (!run || !x) return false;
  if (run.sessionId && x.id && run.sessionId === x.id) return true;
  if (run.threadId && x.threadId && run.threadId === x.threadId) return true;
  return false;
}
function runSigOf(run) { return run ? ((run.sessionId || '') + '|' + (run.threadId || '')) : ''; }

/* ---------- 键盘：把这一页从底部收起来，别让系统整窗上移 ---------- */
function watchKeyboard() {
  const vv = window.visualViewport;
  let baseH = 0;
  const apply = () => {
    const ime = window.__ime || 0;
    const h = window.innerHeight;
    // 键盘没弹出来时的高度就是基准
    if (!ime) baseH = Math.max(baseH, h);
    // 布局视口已经被键盘顶短了多少（App 自己收窄了 WebView，或系统缩了窗口）。
    // 原生那条路走通了这里就是 0，不会重复让位。
    const shrunk = Math.max(0, (baseH || h) - h);
    const left = Math.max(0, ime - shrunk);
    const root = document.documentElement.style;
    root.setProperty('--kb', left + 'px');
    root.setProperty('--kb-top', left + 'px');
    // 键盘在的时候把标签栏收起来，输入框直接贴到键盘上沿
    document.documentElement.classList.toggle('kb', (window.__ime || 0) > 0 || left > 0);
  };
  if (vv) {
    vv.addEventListener('resize', apply);
    vv.addEventListener('scroll', apply);
  }
  window.addEventListener('resize', apply);
  apply();
  // 键盘高度是原生注入的，变化时不一定有 resize 事件，顺手盯一下
  let lastIme = -1;
  setInterval(() => {
    const ime = window.__ime || 0;
    if (ime === lastIme) return;
    lastIme = ime;
    apply();
    setTimeout(apply, 120);
    setTimeout(apply, 360);
  }, 250);
}

/* ---------- 实时信号：手机和电脑两端订阅同一条流 ----------

   以前"正在生成"是各自轮询 /api/status 猜出来的（最慢要等 4 秒），
   现在电脑端在跑的时候，手机这边（以及反过来）立刻就能看到：
   转圈 + 已经跑了多少秒，跑完自动把内容读回来。 */
let liveSrc = null, liveRunAt = 0, liveTick = null, liveAct = '';
// 上一次"只凭历史里的 inProgress 认出来的在跑"去核对的时间（见 applyThreadRun）
let lastRunVerifyAt = 0;
// 别的对话：记各自读到哪一代了、上次什么时候读的，避免反复读
let otherGen = {}, otherAt = {};
// threadId -> true：正在跑的对话（不在前台的那些，列表上要看得见）
let runThreads = {};
// 服务端上一次回报的"每条对话最近动没动、在干什么"（/api/status 的 threads）。
// 列表页的状态点、第三行都从这儿来。
let statusThreads = {};
// 电脑上读出来的"每条对话最近一轮结局"（Codex 自己的状态库，副屏同一份数据）
let turnStatusById = {};
// 服务端程序换了新版本（换了界面）就让页面自己重新加载一次。
// 以前这一步得用户手动刷新，而对话页的下拉是"翻历史"，压根刷不了页面。
let seenBuild = '';
// 轻量校准（跟 DusuWorks/codex-webui 学的）：不指望事件一定送到，
// 每秒问一次"我这条对话变了没"，变了就把内容读回来。
// 断线、丢事件、切页面回来，都能自己补上。
let seenThreadGen = 0, remoteRunning = false, remoteReloadAt = 0, remoteReloadTimer = null;
// 服务端回报的"电脑端正在跑哪条对话"。手机上自己发的那一轮也会出现在这里，
// 所以它同时也回答了"我刚才那条到底送到没有"。
let deskRun = null;

function remoteReload(force) {
  const now = Date.now();
  const wait = force ? 0 : Math.max(0, 1500 - (now - remoteReloadAt));
  if (remoteReloadTimer) return;
  // 正在边收边画的时候别重画历史：整块重建会把那条正在长的气泡从页面上摘掉，
  // 后面的增量就写进一个不在页面上的节点里（看着就像"停了"）。
  // 等这一轮结束（force）再整体对齐。
  if (!force && remoteBubble) return;
  remoteReloadTimer = setTimeout(() => {
    remoteReloadTimer = null;
    remoteReloadAt = Date.now();
    if (openId) reloadOpenChat();
  }, wait);
}
// 电脑那边发起的轮次：手机上边收边画，不用等整段写完才有东西看
let remoteBubble = null, remoteBuf = '', remotePaint = false;
let remotePaintAt = 0, remotePaintTimer = null;

function paintRemote() {
  if (remotePaint) return;
  const wait = 80 - (Date.now() - remotePaintAt);
  if (wait > 0) {
    if (!remotePaintTimer) {
      remotePaintTimer = setTimeout(() => { remotePaintTimer = null; paintRemote(); }, wait);
    }
    return;
  }
  remotePaint = true;
  requestAnimationFrame(() => {
    remotePaint = false;
    remotePaintAt = Date.now();
    if (remoteBubble) { remoteBubble.innerHTML = renderMarkdown(remoteBuf); scrollDown(); }
  });
}
function openRemoteBubble() {
  if (remoteBubble) return;
  remoteBuf = '';
  remoteBubble = addAssistant('', null);
  remoteBubble.classList.add('caret');
}
function closeRemoteBubble() { remoteBubble = null; remoteBuf = ''; }

// 时间说人话：47 秒 / 6 分 47 秒 / 1 小时 3 分
function fmtElapsed(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60), rest = s % 60;
  if (m < 60) return rest ? m + ' 分 ' + rest + ' 秒' : m + ' 分';
  const h = Math.floor(m / 60);
  return h + ' 小时 ' + (m % 60) + ' 分';
}

// 当前在做什么：正在思考 / 正在执行命令：xxx / 正在改文件 / 正在写回答
function setLiveActivity(text) {
  liveAct = text || '';
  const el = document.querySelector('#genbar .gact');
  if (el) el.textContent = liveAct;
}

function paintLive() {
  const gt = document.querySelector('#genbar .gt');
  if (gt) gt.textContent = '正在生成 · ' + fmtElapsed(Date.now() - (liveRunAt || Date.now()));
}

function openLive() {
  if (liveSrc || !window.EventSource) return;
  try {
    liveSrc = new EventSource('/api/events?k=' + encodeURIComponent(TOKEN));
  } catch (_) {
    liveSrc = null;
    return;
  }
  liveSrc.onmessage = (e) => {
    let d = null;
    try { d = JSON.parse(e.data); } catch (_) { return; }
    onLive(d);
  };
  // 断了交给浏览器自己重连（EventSource 自带），这里不用管
}

function onLive(d) {
  const mine = d.sessionId && openId && d.sessionId === openId;
  // 自己正在发这一轮的时候，本地的流已经把事情讲清楚了（也有自己的动画），
  // 就不用再按广播重来一遍，免得两边抢着画
  // 例外：需要用户拍板的卡片（选择题 / 审批）必须放行，否则自己这一轮
  // 里冒出来的问题就永远看不到。
  if (running && mine && d.kind !== 'question' && d.kind !== 'approval') {
    if (d.kind === 'done' || d.kind === 'error') runState = null;
    return;
  }
  switch (d.kind) {
    case 'question':
      if (mine) {
        renderQuestion(d.event || {});
        if (document.hidden) {
          const qs = (d.event && d.event.questions) || [];
          notifyHidden('Codex 问你一件事', qs.map((q) => q.header).filter(Boolean).join('、') || '需要你选一下');
        }
      } else {
        const qs = (d.event && d.event.questions) || [];
        alertPending('Codex 问你一件事',
          qs.map((q) => q.header).filter(Boolean).join('、') || '需要你选一下', d.sessionId);
      }
      break;
    case 'approval':
      if (mine) {
        renderApproval(d.event || {});
        if (document.hidden) {
          const e = d.event || {};
          notifyHidden('Codex 等你确认', e.title || e.detail || '需要你确认');
        }
      } else {
        const e = d.event || {};
        alertPending('Codex 等你确认', e.title || e.detail || '需要你确认', d.sessionId);
      }
      break;
    case 'run':
    case 'working':
      runState = runState || { sessionId: d.sessionId, threadId: d.threadId, startedAt: d.at };
      if (mine) { liveRunAt = Number(d.at) || Date.now(); liveTickStart(); openRemoteBubble(); }
      if ($('p-chats').classList.contains('on')) renderChatsSoon();
      break;
    case 'delta':
    case 'message':
    case 'tool':
    case 'reasoning':
      if (mine) {
        if (!remoteBubble) openRemoteBubble();
        if (d.kind === 'delta' || d.kind === 'message') {
          remoteBuf += (d.event && d.event.text) || '';
          paintRemote();
        }
        if (d.kind === 'tool') setLiveActivity('正在执行：' + (d.event && d.event.text || ''));
        else if (d.kind === 'reasoning') setLiveActivity('正在思考');
        else if (d.kind === 'delta' || d.kind === 'message') setLiveActivity('正在写回答');
        liveTickStart();
      }
      break;
    case 'done':
    case 'error':
      if (mine) closeRemoteBubble();
      // 顺手把这一轮的结局记进本地：列表页靠它显示"已完成/失败"
      if (d.threadId) writeThreadStatus(d.threadId, d.kind === 'error' ? 'failed' : 'completed');
      runState = null;
      liveRunAt = 0;
      hideGenerating();
      refresh().then(() => {
        renderChats();
        if (mine && openId) reloadOpenChat();
      }).catch(() => {});
      break;
  }
}

// 转圈那条提示上带秒表和"正在做什么"，跑多久一眼能看到，不会让人以为卡住了
function liveTickStart() {
  showGenerating();
  paintLive();
  if (liveTick) return;
  liveTick = setInterval(() => {
    if (!document.querySelector('#genbar .gt')) {
      clearInterval(liveTick); liveTick = null;
      $('chat-rundot').classList.remove('on');
      return;
    }
    paintLive();
  }, 1000);
}

/* ---------- 正在跑？每秒问一次很轻的接口 ---------- */
// 让 Service Worker 立刻把新外壳取下来，取好了再刷新。
//
// 为什么需要它：外壳是"缓存优先"，手机上手快，但页面自己 reload 只会又拿到
// 同一份缓存 —— 结果就是电脑上早就改好了，手机十一个小时都还看着老界面。
// 加了"每份外壳只试一次"的闸：SW 万一取不到，这轮就不换，绝不反复刷新。
function forceShellRefresh() {
  const guard = 'shellRefreshFor';
  try {
    // 每个外壳只试一次：试过还换不上就停手，别和轮询组成"一直刷"的死循环
    // （旧外壳的 SHELL_BUILD 不变，那个条件会一直被满足）。
    if (sessionStorage.getItem(guard) === String(SHELL_BUILD)) return;
    sessionStorage.setItem(guard, String(SHELL_BUILD));
  } catch (_) {}
  const sw = navigator.serviceWorker;
  if (!sw || !sw.controller) { location.reload(); return; }
  let done = false;
  const go = () => { if (!done) { done = true; location.reload(); } };
  sw.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'shell-refreshed') go();
  }, { once: true });
  try {
    sw.controller.postMessage({ type: 'force-shell-refresh' });
  } catch (_) {
    go();
    return;
  }
  setTimeout(go, 3000);   // 兜底：SW 没回话也别一直等
}

async function pollStatus() {
  try {
    const r = await api('status');
    if (!r.ok) { netFail(); return; }
    const d = await r.json();
    netOK();
    if (d.build) {
      if (!seenBuild) seenBuild = d.build;
      // 手上这份外壳和电脑上的对不上（SW 是缓存优先，冷启动的第一次轮询就会
      // 拿到旧外壳）。不管这是第几次轮询都得让 SW 去换新外壳——尤其"第一次
      // 轮询就看到 build 已经是新的"这种，老写法会漏掉，手机就一直看着旧界面。
      if (SHELL_BUILD && SHELL_BUILD !== d.build) { forceShellRefresh(); return; }
      if (seenBuild !== d.build) { location.reload(); return; }
    }
    // 我打开的那条对话：内容变了就重读，正在跑就把"正在生成"挂上
    const curTid = (state.active || {}).threadId;
    statusThreads = d.threads || {};
    turnStatusById = d.turnStatus || {};
    // 正在等用户拍板的请求：不指望那一次推送（页面切后台就错过了），
    // 每次轮询都捡一遍。当前这条对话直接把卡片画出来，别的对话至少提醒一声。
    (d.approvals || []).forEach((a) => {
      if (a.sessionId && a.sessionId === openId) {
        if (!$('log').querySelector('[data-approval="' + a.id + '"]')) {
          renderApproval({ approvalId: a.id, kind: a.kind, title: a.title, detail: a.detail, text: a.text });
        }
      } else {
        alertPending('Codex 等你确认', a.title || a.detail || '需要你确认', a.sessionId);
      }
    });
    const info = (curTid && d.threads) ? d.threads[curTid] : null;
    if (info) {
      if (info.n !== seenThreadGen) {
        seenThreadGen = info.n;
        if (!running) remoteReload(info.run);   // 跑着的过程中限速重读
      }
      if (info.run && !remoteRunning && !running) {
        liveRunAt = Number(info.at) || Date.now();
        liveTickStart();
      }
      if (!info.run && remoteRunning) {
        remoteReload(true);                 // 跑完了补最后一遍
        if (liveRunAt) noteElapsed(liveRunAt);
      }
      remoteRunning = !!info.run;
    }
    // 别的对话在跑 / 有更新：悄悄把它们的内容读进缓存，切回去就已经是最新的；
    // 顺手记下哪几条在跑，列表上要给它们转圈。
    const runningNow = {};
    if (d.desk && d.desk.threadId) runningNow[d.desk.threadId] = true;
    Object.keys(d.threads || {}).forEach((tid) => {
      if (!tid) return;
      const inf = d.threads[tid];
      if (inf.run) runningNow[tid] = true;
      if (tid === curTid) return;                    // 正在看的这条走上面的逻辑
      if (inf.n === (otherGen[tid] || 0) && !inf.run) return;
      if (Date.now() - (otherAt[tid] || 0) < 8000) return;   // 每条最多 8 秒读一次
      otherGen[tid] = inf.n;
      otherAt[tid] = Date.now();
      api('threads/read?id=' + encodeURIComponent(tid)).then((r) => (r.ok ? r.json() : null))
        .then((dd) => {
          if (!dd || !dd.messages || !dd.messages.length) return;
          writeMsgs('t-' + tid, dd.messages);       // 存着：切过去立刻就是新的
        }).catch(() => {});
    });
    const runSetChanged = JSON.stringify(runningNow) !== JSON.stringify(runThreads);
    runThreads = runningNow;
    if (runSetChanged && $('p-chats').classList.contains('on')) renderChatsSoon();
    // 电脑那边派下来的调试活（抓图 / 传日志）搭这趟车，省一轮往返
    if (d.phoneCmd) runPhoneCmd(d.phoneCmd);
    const prev = runSig;
    runState = d.running || null;
    runSig = runSigOf(runState);
    const cur = state.active || {};
    // 电脑端那条单独看：手机自己在别的对话上跑一轮时，这条也不能看不见
    const desk = d.desk || null;
    deskRun = desk;
    const deskHere = !!(desk && runMatches(desk, cur));
    if (deskHere) liveRunAt = Number(desk.startedAt) || liveRunAt || Date.now();
    // 只要"我正在看的这条对话在跑"就把提示条一直挂着，不管是手机发的还是电脑端发的。
    //
    // 以前这里把 `running`（手机自己发起的这一轮）排除掉了，以为本地流自己会画提示条——
    // 可本地流只在有事件时才补挂，而轮询每 4 秒就会收走一次：表现就是
    // "正在生成 · N 秒"和扫光动画一闪一闪，跑的久一点（比如卡在一段命令上）就整个不见了。
    if (remoteRunning || deskHere || (runState && runMatches(runState, cur))) showGenerating();
    else hideGenerating();
    // 提示条亮着、但这几分钟一条新消息都没有：拿线程自己的状态核一遍。
    // 长命令跑着的时候本来就安静，别误判成"还在跑"；真结束了的轮次也能立刻收起来。
    // 一分钟最多核一次，成本就是一次读历史。
    const quiet = !info || (Date.now() - Number(info.at || 0) > 180000);
    if ((remoteRunning || deskHere) && !running && quiet && Date.now() - lastRunVerifyAt > 60000) {
      lastRunVerifyAt = Date.now();
      reloadOpenChat();
    }
    // 这一轮跑完了：把电脑上最新的内容读回来
    if (prev && !runState && openId) reloadOpenChat();
    if (runSig !== prev && $('p-chats').classList.contains('on')) renderChatsSoon();
  } catch (_) { netFail(); }
}

// 连续几次问不到电脑就把提示挂出来。以前这里是静默的，
// 手机上看起来一切正常，实际早就断了 —— 我排查时就是被这个骗了。
let netFails = 0;
function netFail() {
  netFails++;
  if (netFails < 4) return;
  const el = $('offbar');
  if (!el) return;
  const txt = $('offtext');
  if (txt) txt.textContent = netFails < 20 ? '连不上电脑，正在重试' : '连不上电脑（已试 ' + netFails + ' 次），检查电脑端服务或网络';
  el.classList.add('on');
}
function netOK() {
  if (!netFails) {
    // 就算没挂过"断网"条，也可能刚从一个请求级失败里缓过来，顺手试着补发
    if (outbox.length) flushOutbox();
    return;
  }
  netFails = 0;
  const el = $('offbar');
  if (el) el.classList.remove('on');
  if (outbox.length) flushOutbox();
}

// 列表别一有风吹草动就整个重画：合并到 400ms 一次
let chatsSoon = null;
function renderChatsSoon() {
  if (chatsSoon) return;
  chatsSoon = setTimeout(() => { chatsSoon = null; renderChats(); }, 400);
}

// 正在生成时挂一条提示。它挂在 #genhost（输入框上方），不进 #log ——
// 消息列表每次重画都会整块清空，挂里面就会被抹掉。
function showGenerating() {
  if (!$('chat').classList.contains('on')) return;
  // 已经挂着也要把秒表和"正在做什么"刷一下：万一定时器那一路断过，轮询还能把它续上
  if ($('genbar')) { $('chat-rundot').classList.add('on'); setLiveActivity(liveAct); paintLive(); return; }
  const d = document.createElement('div');
  d.id = 'genbar';
  d.className = 'genbar';
  d.innerHTML =
    '<div class="gline">' + ico('circle-notch', 'gen-ic') +
      '<span class="gt">正在生成</span></div>' +
    '<div class="gact"></div>' +
    '<div class="sweep"><i></i></div>';
  $('genhost').appendChild(d);
  $('chat-rundot').classList.add('on');
  setLiveActivity(liveAct);
  paintLive();
}
function hideGenerating() {
  const d = $('genbar');
  if (d) d.remove();
  $('chat-rundot').classList.remove('on');
}

// 手机离开这条对话之后那一轮才跑完：回来时把电脑上最新的内容读回来补上。
async function reloadOpenChat() {
  const s = state.active || {};
  if (!openId) return;
  // 状态和历史这两趟互不依赖：一起发，别串着等（一趟就是 363ms）
  const tid = s.threadId || '';
  const histP = tid ? readThread(tid) : null;
  await refresh();
  const cur = state.active || {};
  if (!openId || !cur.threadId) return;
  try {
    const d = (histP && cur.threadId === tid) ? await histP : await readThread(cur.threadId);
    if (!d) return;
    const remote = d.messages || [];
    paintContinue(d.lastStatus);
    applyThreadRun(d.lastStatus);
    writeThreadStatus(cur.threadId, d.lastStatus);   // 列表页照它显示"已完成/失败/已中断"
    if (!remote.length || !openId) return;
    writeMsgs('t-' + cur.threadId, remote);
    renderHistory(remote);
    $('chat-title').textContent = chatTitle(cur);
  } catch (_) {}
}

function hhmm(ts) {
  if (!ts) return '';
  const d = new Date(ts < 1e12 ? ts * 1000 : ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

/* ---------- Markdown ---------- */
/* Markdown 表格 -> 真表格。
   模型给的对比表常有四五列，在手机上按原样排会挤成一团、连列都分不清，
   所以这儿只负责认出表格并吐出 <table>，怎么摆交给 CSS（横向滑动 + 首列钉住）。
   在 esc() 之后调用：单元格内容已经转义过，插进去的只有我们自己生成的标签。 */
const mdHasPipe = (s) => /\|/.test(s) && /^\s*\|?.+\|?\s*$/.test(s);
function mdCells(line) {
  let s = String(line).trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|')) s = s.slice(0, -1);
  return s.split('|').map((c) => c.replace(/\\\|/g, '|').trim());
}
function mdIsSep(line) {
  const cells = mdCells(line);
  if (cells.length < 2) return false;          // 单列的 --- 是分隔线，不是表格
  return cells.every((c) => /^:?-{1,}:?$/.test(c));
}
function mdTables(text) {
  const lines = String(text).split('\n');
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    if (!mdHasPipe(lines[i]) || !(i + 1 < lines.length) || !mdIsSep(lines[i + 1])) {
      out.push(lines[i]);
      continue;
    }
    const head = mdCells(lines[i]);
    const align = mdCells(lines[i + 1]).map((c) =>
      c.startsWith(':') && c.endsWith(':') ? 'c' : c.endsWith(':') ? 'r' : c.startsWith(':') ? 'l' : '');
    const body = [];
    let j = i + 2;
    for (; j < lines.length; j++) {
      if (!mdHasPipe(lines[j]) || mdIsSep(lines[j])) break;   // 空行、分隔线、普通段落都收尾
      body.push(mdCells(lines[j]));
    }
    const cols = Math.max(head.length, ...body.map((r) => r.length));
    while (head.length < cols) head.push('');
    const cls = (k) => (align[k] ? ' class="ta-' + align[k] + '"' : '');
    let html = '<div class="tw"><table><thead><tr>';
    head.forEach((c, k) => { html += '<th' + cls(k) + '>' + c + '</th>'; });
    html += '</tr></thead><tbody>';
    body.forEach((row) => {
      html += '<tr>';
      for (let k = 0; k < cols; k++) html += '<td' + cls(k) + '>' + (row[k] == null ? '' : row[k]) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    out.push(html);
    i = j - 1;
  }
  return out.join('\n');
}
/* 本机图片路径 -> 能喂给 <img> 的地址。
   手机碰不到这台机器的盘，图本身得让电脑读出来（/api/fs/image）；
   外链（http/https）和已经是接口地址的原样返回。 */
function toImgSrc(src, full) {
  const s = String(src || '').trim();
  if (!s) return s;
  if (/^https?:\/\//i.test(s) || s.startsWith('/api/')) return s;
  if (!/^[A-Za-z]:[\\/]/.test(s) && !s.startsWith('/')) return s;
  if (!/\.(png|jpe?g|gif|webp|bmp)$/i.test(s)) return s;
  const base = '/api/fs/image?path=' + encodeURIComponent(s) + '&k=' + TOKEN;
  // 不带 w 是缩略图（服务端默认缩到 1200 宽），w=0 才是原图
  return full ? (base + '&w=0') : base;
}

function renderMarkdown(src) {
  const blocks = [];
  let text = String(src || '').replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push(code.replace(/\n$/, ''));
    return '\u0000B' + (blocks.length - 1) + '\u0000';
  });
  // Markdown 图片：先占位再还原（还原在函数尾），点一下全屏看
  const imgs = [];
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src2) => {
    imgs.push({ alt: alt, src: src2 });
    return '\u0000I' + (imgs.length - 1) + '\u0000';
  });
  // Codex 经常在正文里直接甩一条图片的绝对路径（不是 Markdown 语法），
  // 手机上那就是一串看不懂也点不开的字。连它一起认出来，跟 Markdown 图片
  // 走同一套渲染：直接显示，点一下全屏。
  text = text.replace(
    // Unix 那种绝对路径写成 \/(?!\/)，是为了避开 https:// 里那两个斜杠 ——
    // 否则 "https://x/a.png" 会被当成以 / 开头的本机路径。
    /(^|[\s(（【>、，。:：])((?:[A-Za-z]:[\\/]|\/(?!\/))[^\s<>"'`|）】]*?\.(?:png|jpe?g|gif|webp|bmp))/gi,
    (m, pre, p) => { imgs.push({ alt: '', src: p }); return pre + '\u0000I' + (imgs.length - 1) + '\u0000'; }
  );
  text = esc(text);
  text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/^###\s?(.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^##?\s?(.*)$/gm, '<h2>$1</h2>');
  text = mdTables(text);
  text = text.replace(/\n/g, '<br>');
  text = text.replace(/\u0000B(\d+)\u0000/g, (m, i) =>
    '<pre><button class="copybtn" data-copy="' + i + '">复制</button><code>' + esc(blocks[+i]) + '</code></pre>');
  text = text.replace(/\u0000I(\d+)\u0000/g, (m, i) => {
    const im = imgs[+i];
    if (!im) return m;
    return '<img class="mdimg" src="' + esc(toImgSrc(im.src)) + '"' +
      ' data-full="' + esc(toImgSrc(im.src, true)) + '"' +
      ' alt="' + esc(im.alt) + '" loading="lazy">';
  });
  return text;
}
function attachCopy(root) {
  root.querySelectorAll('.copybtn').forEach((btn) => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', () => {
      const code = btn.closest('pre').querySelector('code');
      const done = () => { const o = btn.textContent; btn.textContent = '已复制'; setTimeout(() => (btn.textContent = o), 1200); };
      if (navigator.clipboard) navigator.clipboard.writeText(code.textContent).then(done).catch(done);
      else done();
    });
  });
}

window.__back = function () {

    if ($('imgview').classList.contains('on')) { closeImgViewer(); return true; }
    if ($('sheet').classList.contains('on')) { closeSheet(); return true; }

    if ($('chat').classList.contains('on')) { closeChat(); return true; }

  return false;

/* ---------- 一条对话现在是什么状态（照副屏 MMM-CodexStatus 那套） ----------
   在跑：绿点「运行中」；还挂着但 10 分钟没动静：琥珀「未收尾」（副屏同一个阈值）；
   最近一轮的结局（完成/失败/中断）在打开那条对话时记下来，列表直接复用。 */
const THREAD_STATE_LABEL = {
  run: '运行中', stall: '未收尾', bad: '失败', stop: '已中断', done: '已完成', idle: '',
};
const STALL_MS = 10 * 60 * 1000;

function readThreadStatus() {
  try { return JSON.parse(localStorage.getItem('codex.tstatus.v1') || '{}'); } catch (_) { return {}; }
}
function writeThreadStatus(tid, status) {
  if (!tid || !status) return;
  try {
    const m = readThreadStatus();
    m[tid] = { s: String(status), at: Date.now() };
    localStorage.setItem('codex.tstatus.v1', JSON.stringify(m));
  } catch (_) {}
}
// 服务端给的"上一轮结局" → 列表上那几种状态
function mapTurnStatus(s) {
  switch (String(s || '')) {
    case 'failed': return 'bad';
    case 'interrupted': return 'stop';
    case 'completed': return 'done';
    default: return '';
  }
}
function agoText(ms) {
  const d = Math.max(0, Number(ms) || 0);
  if (d < 45000) return '刚刚';
  const m = Math.floor(d / 60000);
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}

// 这条对话现在的状态，外加"它此刻在干什么"那一行
function chatState(it) {
  const tid = it.threadId || '';
  const info = (tid && statusThreads[tid]) ? statusThreads[tid] : null;
  const busy = runMatches(runState, { id: it.sessionId, threadId: tid }) || !!(tid && runThreads[tid]);
  if (busy) {
    const at = info ? Number(info.at) || 0 : 0;
    const quiet = at ? Date.now() - at : 0;
    const stalled = quiet > STALL_MS;
    let started = 0;
    if (runState && runMatches(runState, { id: it.sessionId, threadId: tid })) {
      started = Number(runState.startedAt) || 0;
    }
    if (!started) started = at;
    return {
      key: stalled ? 'stall' : 'run',
      label: THREAD_STATE_LABEL[stalled ? 'stall' : 'run'],
      act: (info && info.act) || (stalled ? '超过 ' + Math.round(quiet / 60000) + ' 分钟没动静' : ''),
      started: started, at: at,
    };
  }
  // 电脑上读到的"最近一轮结局"最准（跟副屏同一份数据）；
  // 读不到就退回手机自己记的那份（打开过这条对话时存下来的）。
  const srv = (tid && turnStatusById[tid]) || null;
  if (srv && srv.status === 'inProgress') {
    // 库里写着还在跑、而我们这边没收到"在跑"的信号（比如电脑端自己跑的看丢了）：
    // 按"多久没动静"判运行中还是未收尾，跟上面同一套规则
    const started = Number(srv.startedAt) || 0;
    const quiet = (info && Number(info.at)) ? Date.now() - Number(info.at)
      : (started ? Date.now() - started : 0);
    const stalled = quiet > STALL_MS;
    return {
      key: stalled ? 'stall' : 'run',
      label: THREAD_STATE_LABEL[stalled ? 'stall' : 'run'],
      act: (info && info.act) || (stalled ? '超过 ' + Math.round(quiet / 60000) + ' 分钟没动静' : ''),
      started: started, at: (info && Number(info.at)) || 0, duration: 0,
    };
  }
  const cached = tid ? (readThreadStatus()[tid] || null) : null;
  const key = (srv && mapTurnStatus(srv.status)) || (cached && mapTurnStatus(cached.s)) || 'idle';
  const at = (srv && Number(srv.completedAt)) || (cached && Number(cached.at)) || (info && Number(info.at)) || 0;
  return {
    key: key, label: THREAD_STATE_LABEL[key] || '', act: '', started: 0, at: at,
    duration: (srv && Number(srv.durationMs)) || 0,
  };
}

function renderChats() {
  const box = $('chats-body');
  bindChatSearch();
  bindViewSwitch();
  const pcThreads = threads.length ? threads : cachedThreads();
  const byThread = new Map();
  pcThreads.forEach((t) => byThread.set(t.id, t));

  // 搜索：按标题 / 项目名过滤（本地过滤，打字即筛，不用等网络）
  const q = (chatQuery || '').trim().toLowerCase();
  const hit = (s) => !q || s.toLowerCase().includes(q);

  // 一条对话只出现一次：本地接管过的用本地那条（能直接发消息），
  // 电脑上还没接管的用电脑那条（点了才接管）。
  const usedThreads = new Set();
  const items = [];
  // 同一条电脑对话可能被接管过两次（旧版本留下的），只画一条：
  // 优先当前选中的那条，其次更新时间新的。
  const sessions = (state.sessions || []).slice().sort((a, b) => {
    const aa = a.id === state.activeId ? 1 : 0;
    const bb = b.id === state.activeId ? 1 : 0;
    return (bb - aa) || ((b.updatedAt || 0) - (a.updatedAt || 0));
  });
  const seenLocal = new Set();
  sessions.forEach((s) => {
    if (s.threadId && seenLocal.has(s.threadId)) return;
    if (s.threadId) seenLocal.add(s.threadId);
    const t = s.threadId ? byThread.get(s.threadId) : null;
    if (s.threadId) usedThreads.add(s.threadId);
    items.push({
      key: 'local:' + s.id, icon: 'chat-circle-dots',
      title: (t && (t.name || t.preview)) || s.title || '新对话',
      project: dirLabel(s, t),
      // "上次聊到什么时候"取两边的新值：手机这边发过消息、电脑那边打开过，
      // 都算一次活动。只认一边会把刚聊过的对话排到后面去。
      ts: Math.max((t && t.updatedAt) || 0, s.updatedAt || 0), active: s.id === state.activeId,
      threadId: s.threadId || '', sessionId: s.id,
    });
  });
  pcThreads.forEach((t) => {
    if (usedThreads.has(t.id)) return;
    items.push({
      key: 'thread:' + t.id, icon: 'desktop',
      title: t.name || t.preview || '未命名对话', project: dirLabel(null, t),
      ts: t.updatedAt, active: false, threadId: t.id, sessionId: '',
    });
  });
  items.forEach((it) => { it._t = byThread.get(it.threadId) || null; });
  // 搜索命中：标题或项目名里含关键字。搜索时全部展开，不折叠挡路。
  const shown = q ? items.filter((it) => hit(it.title || '') || hit(it.project || '')) : items;

  // 顶部三个汇总（照副屏那排 chip）：在跑 / 未收尾 / 已完成
  const sums = { run: 0, stall: 0, done: 0 };
  shown.forEach((it) => { const k = chatState(it).key; if (sums[k] !== undefined) sums[k]++; });
  const sumBox = $('chats-sum');
  if (sumBox) {
    sumBox.innerHTML =
      (sums.run ? '<span class="chip run">运行 ' + sums.run + '</span>' : '') +
      (sums.stall ? '<span class="chip stall">未收尾 ' + sums.stall + '</span>' : '') +
      (sums.done ? '<span class="chip done">已完成 ' + sums.done + '</span>' : '') +
      (!sums.run && !sums.stall && !sums.done ? '<span class="chip">没有正在跑的</span>' : '');
  }

  if (!shown.length) {
    $('chats-body').innerHTML = importing ? '' : '<div class="group"><div class="empty">' +
      ico(q ? 'magnifying-glass' : 'chat-circle-dots') +
      '<div class="e1">' + (q ? '没找到匹配的对话' : '还没有对话') + '</div>' +
      '<div class="e2">' + (q ? '换个词试试' : '点右上角的加号，选个项目开始') + '</div></div></div>';
    return;
  }

  const byProject = new Map();
  shown.forEach((it) => {
    if (!byProject.has(it.project)) byProject.set(it.project, []);
    byProject.get(it.project).push(it);
  });
  const projects = [...byProject.entries()].sort((a, b) => {
    const at = Math.max(...a[1].map((x) => x.ts || 0));
    const bt = Math.max(...b[1].map((x) => x.ts || 0));
    return bt - at;
  });

  // 一行长什么样（照副屏 MMM-CodexStatus 那套）：
  //   ● 标题 ……………………  运行中
  //     Codex手机端 · 已跑 2分31秒
  //     ▸ npm run build
  const rowHtml = (it) => {
    const st = chatState(it);
    const meta = [shortPath(it.project)];
    if (st.key === 'run' || st.key === 'stall') {
      meta.push('已跑 ' + fmtElapsed(Date.now() - (st.started || Date.now())));
    } else {
      if (st.duration) meta.push('耗时 ' + fmtElapsed(st.duration));
      if (st.at) meta.push(agoText(Date.now() - st.at));
      else meta.push(hhmm(it.ts));
    }
    return '<button class="citem ' + st.key + (it.active ? ' on' : '') + '" data-key="' + esc(it.key) + '">' +
      '<span class="cdot"></span>' +
      '<span class="cbody">' +
        '<span class="crow"><span class="ctitle">' + esc(it.title) + '</span>' +
        (st.label ? '<span class="cstat">' + esc(st.label) + '</span>' : '') + '</span>' +
        '<span class="cmeta">' + esc(meta.filter(Boolean).join(' · ')) + '</span>' +
        (st.act ? '<span class="cact">' + esc(st.act) + '</span>' : '') +
      '</span></button>';
  };

  let h = '';
  if (chatView === 'list') {
    // 列表视图：不分组，按时间从新到旧一列排下来
    h += '<div class="group"><div class="clist">';
    shown.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)).forEach((it) => { h += rowHtml(it); });
    h += '</div></div>';
  } else {
  projects.forEach(([proj, list]) => {
    list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    const name = shortPath(proj);
    const folded = !q && collapsedProjects.has(proj);
    h += '<div class="group"><div class="grouphead ' + (folded ? 'fold' : 'open') +
      '" data-proj="' + esc(proj) + '">' +
      ico('caret-right', 'cv') + esc(name) +
      '<span class="n">' + list.length + '</span></div>' +
      '<div class="clist"' + (folded ? ' style="display:none"' : '') + '>';
    list.forEach((it) => { h += rowHtml(it); });
    h += '</div></div>';
  });
  }
  box.innerHTML = h;
  // 分组折叠：点分组标题收起/展开，状态记在本地（下次打开还是这样）
  box.querySelectorAll('.grouphead').forEach((gh) => {
    gh.addEventListener('click', () => {
      const proj = gh.dataset.proj || '';
      if (collapsedProjects.has(proj)) collapsedProjects.delete(proj);
      else collapsedProjects.add(proj);
      saveCollapsed();
      renderChats();
    });
  });
  const bindRow = (el) => {
    el.addEventListener('click', () => {
      closeDrawer();
      const [kind, id] = el.dataset.key.split(':');
      const local = kind === 'local' ? ((state.sessions || []).find((x) => x.id === id) || {}) : null;
      if (local) {
        // 接管时用的是占位名，知道真名就顺手改过来（attach 是幂等的，不会重复建会话）
        const t = local.threadId ? byThread.get(local.threadId) : null;
        if (t && (!local.title || local.title === '电脑上的对话')) {
          attachThread(local.threadId, { name: t.name || t.preview || '', cwd: t.cwd || '' });
          return;
        }
        openChat(id);
        return;
      }
      const t = byThread.get(id) || {};
      attachThread(id, { name: t.name || t.preview || '', cwd: t.cwd || '' });
    });
  };
  box.querySelectorAll('.citem').forEach((el) => {
    bindRow(el);
    // 长按删掉本地的这条（电脑上的对话本身不动）
    const [kind, id] = el.dataset.key.split(':');
    if (kind !== 'local') return;
    let timer = null;
    el.addEventListener('touchstart', () => { timer = setTimeout(() => askRemoveSession(id), 650); }, { passive: true });
    el.addEventListener('touchend', () => clearTimeout(timer));
    el.addEventListener('touchmove', () => clearTimeout(timer));
  });
}

function askRemoveSession(id) {
  const s = (state.sessions || []).find((x) => x.id === id);
  if (!s) return;
  openSheet('<h3>移出列表？</h3><div class="desc">只是不再显示在手机上，电脑里的对话和文件都不动。</div>' +
    '<div class="actions"><button id="r-no">取消</button><button class="no" id="r-yes">移出</button></div>', () => {
    $('r-no').addEventListener('click', closeSheet);
    $('r-yes').addEventListener('click', async () => {
      await apiPost('session/delete', { id });
      closeSheet();
      await refresh();
      renderChats();
      // 删掉的正好是当前看的那条：换到前面一条去，别留个空白主屏
      if (id === openId) { closeChat(); ensureChatOpen(); }
      toast('已移出列表');
    });
  });
}

function rowHtml(icon, title, sub, active, tail, kind, id, danger) {
  return '<button class="row' + (active ? ' on' : '') + (danger ? ' danger' : '') + '" data-key="' + kind + ':' + esc(id) + '">' +
    '<span class="lead">' + ico(icon) + '</span>' +
    '<span class="bd"><span class="t1">' + esc(title) + '</span>' +
    (sub ? '<span class="t2">' + esc(sub) + '</span>' : '') + '</span>' +
    (tail ? '<span class="tail">' + esc(tail) + '</span>' : '<span class="tail">' + ico('caret-right', 'sm') + '</span>') +
    '</button>';
}
function shortPath(p) {
  if (!p) return '';
  const parts = String(p).split(/[\\/]/).filter(Boolean);
  const name = parts.length <= 1 ? p : parts[parts.length - 1];
  // 有些目录名就是一长串英文，太长了分组标题会撑破
  return String(name).length > 22 ? String(name).slice(0, 21) + '…' : name;
}
function shortHost(u) {
  if (!u) return '';
  try { return new URL(u).host; } catch (_) { return String(u); }
}

async function loadThreads(force) {

/* ---------- 下拉刷新 ---------- */
function attachPull(scrollEl, indicator, doRefresh) {
  let startY = 0, pulling = false, dist = 0, busy = false;
  const txt = indicator.querySelector('span');
  const reset = () => {
    indicator.classList.remove('on');
    indicator.style.height = '0px';
    pulling = false;
    dist = 0;
  };
  scrollEl.addEventListener('touchstart', (e) => {
    if (busy || scrollEl.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    pulling = true;
    dist = 0;
  }, { passive: true });
  scrollEl.addEventListener('touchmove', (e) => {
    if (!pulling || busy) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0 || scrollEl.scrollTop > 0) { reset(); return; }
    indicator.classList.add('on');
    indicator.style.height = Math.min(dist * 0.45, 58) + 'px';
    if (txt) txt.textContent = dist > 110 ? '松手刷新' : '下拉刷新';
  }, { passive: true });
  scrollEl.addEventListener('touchend', async () => {
    if (!pulling || busy) return;
    if (dist > 110) {
      busy = true;
      indicator.classList.add('busy');
      indicator.classList.remove('on');
      indicator.style.height = '44px';
      if (txt) txt.textContent = '正在刷新';
      try { await doRefresh(); } catch (_) {}
      indicator.classList.remove('busy');
      busy = false;
    }
    reset();
  });
}
